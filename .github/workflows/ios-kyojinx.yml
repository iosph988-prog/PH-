      - name: Fix Swift concurrency for generated device identity calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          for name in ("App.swift", "views/PatchProjectsView.swift"):
              path = Path("source/3105-1.1.1/ThreeOneOSFive") / name
              text = path.read_text()
              text = text.replace("UIDevice.current.identifierForVendor?.uuidString", "(await UIDevice.current.identifierForVendor)?.uuidString")
              if name == "App.swift":
                  import re
                  def replace_device_id(match):
                      indent = match.group(1)
                      return indent + "let vendorID = await UIDevice.current.identifierForVendor\n" + indent + 'let deviceID = vendorID?.uuidString ?? "unknown-device"'
                  text = re.sub(
                      r"(?m)^(\s*)let deviceID = .*identifierForVendor.*$",
                      replace_device_id,
                      text,
                  )
                  text = re.sub(
                      r"(?m)^(\s*)let value = snapshot\?\.deviceID .*identifierForVendor.*$",
                      r'\1let value = snapshot?.deviceID ?? "Indisponível"',
                      text,
                  )
              path.write_text(text)
          exploit = Path("source/3105-1.1.1/ThreeOneOSFive/kexploit/kexploit_opa334.m")
          if exploit.exists():
              source = exploit.read_text()
              source = source.replace(
                  "#import <sys/fileport.h>",
                  "#if __has_include(<sys/fileport.h>)\n#import <sys/fileport.h>\n#else\ntypedef mach_port_t fileport_t;\nextern int fileport_makeport(int fd, fileport_t *port);\nextern int fileport_makefd(fileport_t port);\n#endif",
                  1,
              )
              exploit.write_text(source)
          PYFIX

