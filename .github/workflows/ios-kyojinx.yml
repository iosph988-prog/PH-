          python3 - "$NAV_SWIFT" "$CONTENT_SWIFT" "$PATCH_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          nav, content, patch = map(Path, sys.argv[1:])
          n = nav.read_text()
          n = re.sub(r'(?s)(var visibleSections: \[AppSection\] \{).*?\n    \}', r'\1\n        [.patches, .external, .texture].filter(isVisible)\n    }', n, count=1)
          n = n.replace('AppSection.allCases.filter(isVisible)', '[.patches, .external, .texture].filter(isVisible)')
          n = re.sub(r'(init\(\s*\n\s*selectedTab: Int = )0(,)', r'\1AppSection.patches.rawValue\2', n, count=1)
          n = n.replace('selectedTab = AppSection.home.rawValue', 'selectedTab = AppSection.patches.rawValue')
          nav.write_text(n)
          c = content.read_text()
          c = c.replace('} ?? .home', '} ?? .patches')
          c = c.replace('?? .home', '?? .patches')
          c = c.replace('initialTab = 0', 'initialTab = AppSection.patches.rawValue')
          c = c.replace('AppSection.allCases.filter(isVisible)', '[.patches, .external, .texture].filter(isVisible)')
          c = c.replace('ForEach(featureVisibility.visibleSections)', 'ForEach([AppSection.patches, .external, .texture])')
          compact = '''    private var compactLayout: some View {
          TabView(selection: tabSelection) {
