          content.write_text(c)
          p = patch.read_text()
          p, removed = re.subn(r'(?m)^\s*navItem\(title: "(?:Início|Home)".*\n', '', p)
          if removed == 0:
              p = p.replace('house.fill', 'gamecontroller.fill')
          patch.write_text(p)
          PY
