name: 3105 - Kyojinx Integrated Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches].filter(isVisible)", 1))
          PY
      - name: Remove terminal and settings toolbar buttons
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = r"\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showLogs = true \} label: \{\n\s*Image\(systemName: \"apple\.terminal\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_logs\"\)\)\n\s*\}\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showSettings = true \} label: \{\n\s*Image\(systemName: \"gearshape\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_settings\"\)\)\n\s*\}"
          updated, count = re.subn(pattern, "", text, count=1)
          if count != 1:
              raise SystemExit("terminal/settings toolbar block not found")
          p.write_text(updated)
          PY

      - name: Set Início and Injector navigation labels
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('title: language.text(section.titleKey)', 'title: section == .home ? "Início" : "Injector"', 1)
          t=t.replace('systemImage: section.systemImage', 'systemImage: section == .home ? "house.fill" : "rocket.fill"', 1)
          p.write_text(t)
          PY

      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          if text2 == text: raise SystemExit('featuresSection call not found')
          p.write_text(text2)
          PY
      - name: Add preloaded game cards and resources
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          mkdir -p "$APP_DIR/PreloadedPatches"
          cp 6F54F0A3-A7FC-4AED-8E8E-4234D141B85D.png "$APP_DIR/PreloadedPatches/free_fire_card.png"
          cp BC397CF8-956B-49A7-A6BB-772CEEA5217A.png "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
          for f in Hologramarosa\(2\).3105 Hsalto+antena\(2\).3105 Hspeito100%cache\(2\).3105 Magiccache\(2\).3105 Hsaltocache\(2\).3105 Hologramaverde\(5\).3105 Hspeitoavatar\(2\).3105 120FPS\(2\).3105 Hspescoçocache\(2\).3105 Hologramavermelho\(2\).3105 Hologramaverde\(4\).3105 Hologramazul\(2\).3105 Hspeito+antenaavatar\(1\).3105 Magicavatar\(2\).3105 Pescoço+antenaavatar\(2\).3105; do cp "$f" "$APP_DIR/PreloadedPatches/"; done
          PBX=source/3105-1.1.1/ThreeOneOSFive.xcodeproj/project.pbxproj
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          ref='''\t\tA1B2C3D5 /* PreloadedPatches */ = {isa = PBXFileReference; lastKnownFileType = folder; path = PreloadedPatches; sourceTree = "<group>"; };'''
          build='''\t\tA1B2C3D6 /* PreloadedPatches in Resources */ = {isa = PBXBuildFile; fileRef = A1B2C3D5 /* PreloadedPatches */; };'''
          if 'A1B2C3D5' not in t:
              t=t.replace('/* End PBXFileReference section */', ref+'\n/* End PBXFileReference section */')
              t=t.replace('/* End PBXBuildFile section */', build+'\n/* End PBXBuildFile section */')
              t=t.replace('3105A031 /* Assets.xcassets */,', 'A1B2C3D5 /* PreloadedPatches */,\n\t\t\t\t3105A031 /* Assets.xcassets */,')
              t=t.replace('files = (\n\t\t\t\t3105A211,', 'files = (\n\t\t\t\tA1B2C3D6 /* PreloadedPatches in Resources */,\n\t\t\t\t3105A211,')
          p.write_text(t)
          PY
          cat > source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          private struct PreloadedGame: Identifiable { let id: String; let title: String; let bundleID: String; let imageName: String; let patches: [PreloadedPatch] }
          private struct PreloadedPatch: Identifiable, Hashable { let id: String; let title: String; let fileName: String }
          private let preloadedGames: [PreloadedGame] = [
              PreloadedGame(id: "free-fire", title: "Free Fire", bundleID: "com.dts.freefireth", imageName: "free_fire_card", patches: [
                  PreloadedPatch(id: "normal-rosa", title: "Hologramarosa", fileName: "Hologramarosa(2).3105"), PreloadedPatch(id: "normal-salto-antena", title: "Hsalto + antena", fileName: "Hsalto+antena(2).3105"), PreloadedPatch(id: "normal-peito-cache", title: "Hspeito 100% cache", fileName: "Hspeito100%cache(2).3105"), PreloadedPatch(id: "normal-magic-cache", title: "Magic cache", fileName: "Magiccache(2).3105"), PreloadedPatch(id: "normal-salto-cache", title: "Hsalto cache", fileName: "Hsaltocache(2).3105"), PreloadedPatch(id: "normal-verde", title: "Holograma verde", fileName: "Hologramaverde(5).3105"), PreloadedPatch(id: "normal-peito-avatar", title: "Hspeito avatar", fileName: "Hspeitoavatar(2).3105"), PreloadedPatch(id: "normal-120fps", title: "120 FPS", fileName: "120FPS(2).3105"), PreloadedPatch(id: "normal-pescoco-cache", title: "Hspescoco cache", fileName: "Hspescoçocache(2).3105"), PreloadedPatch(id: "normal-vermelho", title: "Holograma vermelho", fileName: "Hologramavermelho(2).3105")
              ]),
              PreloadedGame(id: "free-fire-max", title: "Free Fire MAX", bundleID: "com.dts.freefiremax", imageName: "free_fire_max_card", patches: [
                  PreloadedPatch(id: "max-verde", title: "Holograma verde", fileName: "Hologramaverde(4).3105"), PreloadedPatch(id: "max-azul", title: "Holograma azul", fileName: "Hologramazul(2).3105"), PreloadedPatch(id: "max-peito-antena", title: "Hspeito + antena avatar", fileName: "Hspeito+antenaavatar(1).3105"), PreloadedPatch(id: "max-magic", title: "Magic avatar", fileName: "Magicavatar(2).3105"), PreloadedPatch(id: "max-pescoco", title: "Pescoço + antena avatar", fileName: "Pescoço+antenaavatar(2).3105")
              ])
          ]

          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore(); @State private var selectedGame: PreloadedGame?
              var body: some View { NavigationStack { ScrollView { VStack(spacing: 18) { ForEach(preloadedGames) { game in Button { selectedGame = game } label: { PreloadedGameCard(game: game) }.buttonStyle(.plain) } }.padding(.horizontal, 16).padding(.vertical, 24) }.background(Color(.systemGroupedBackground)).navigationTitle("Patches").navigationBarTitleDisplayMode(.inline).sheet(item: $selectedGame) { game in PreloadedPatchListView(game: game, store: store) } } }
          }
          private struct PreloadedGameCard: View {
              let game: PreloadedGame
              var body: some View { HStack(spacing: 16) { gameImage.frame(width: 112, height: 112).clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous)); VStack(alignment: .leading, spacing: 7) { Text(game.title).font(.title3.weight(.bold)); Text("Abrir arquivos pré-carregados").font(.title3).foregroundStyle(.secondary); Text(game.bundleID).font(.subheadline.monospaced()).foregroundStyle(.blue).lineLimit(1) }; Spacer(); Image(systemName: "chevron.right").font(.title2.weight(.semibold)).foregroundStyle(.secondary) }.padding(16).background(.background, in: RoundedRectangle(cornerRadius: 28, style: .continuous)).overlay(RoundedRectangle(cornerRadius: 28, style: .continuous).stroke(Color.gray.opacity(0.28))) }
              @ViewBuilder private var gameImage: some View { if let url = Bundle.main.url(forResource: game.imageName, withExtension: "png", subdirectory: "PreloadedPatches"), let image = UIImage(contentsOfFile: url.path) { Image(uiImage: image).resizable().scaledToFill() } else { RoundedRectangle(cornerRadius: 18).fill(Color.orange) } }
          }
          private struct PreloadedPatchListView: View {
              let game: PreloadedGame; @ObservedObject var store: PatchProjectStore; @Environment(\.dismiss) private var dismiss; @State private var activePatchIDs: Set<String> = []; @State private var pendingPatch: PreloadedPatch?; @State private var logs: [String] = []
              private var isInjected: Bool { !activePatchIDs.isEmpty }
              var body: some View { NavigationStack { List { Section { StatusPanel(isInjected: isInjected, logs: logs) }; Section { ForEach(game.patches) { patch in patchRow(patch) } } header: { Text("Patches disponíveis") } }.listStyle(.insetGrouped).navigationTitle(game.title).navigationBarTitleDisplayMode(.inline).toolbar { ToolbarItem(placement: .navigationBarTrailing) { Button("Fechar") { dismiss() } } }.alert(item: $pendingPatch) { patch in Alert(title: Text("Aplicar este patch?"), message: Text("Os arquivos serão validados e aplicados com segurança."), primaryButton: .default(Text("Aplicar patch")) { activate(patch) }, secondaryButton: .cancel()) } } }
              @ViewBuilder private func patchRow(_ patch: PreloadedPatch) -> some View { let active = activePatchIDs.contains(patch.id); HStack(spacing: 12) { Image(systemName: active ? "shippingbox.fill" : "shippingbox").font(.title2).foregroundStyle(.blue).frame(width: 30); VStack(alignment: .leading, spacing: 4) { Text(patch.title).font(.body.weight(.semibold)); Label(active ? "Patch ativado" : "Patch desativado", systemImage: active ? "checkmark.circle.fill" : "power").font(.caption).foregroundStyle(active ? .green : .secondary) }; Spacer(); Toggle("", isOn: Binding(get: { activePatchIDs.contains(patch.id) }, set: { enabled in if enabled { pendingPatch = patch } else { deactivate(patch) } })).labelsHidden().tint(.blue) }.padding(.vertical, 8) }

              @State private var appliedProjectIDs: [String: UUID] = [:]

              private func activate(_ patch: PreloadedPatch) {

                  guard let url = bundledFile(named: patch.fileName) else { logs.insert("[\(timeStamp())] Falha: arquivo não encontrado \(patch.title)", at: 0); return }

                  logs.insert("[\(timeStamp())] Validando \(patch.title)", at: 0)

                  Task.detached(priority: .userInitiated) {

                      do {

                          let data = try PatchProjectLibrary.readPackage(at: url)

                          let decoded = try PatchPackageCodec.decode(data, password: nil)

                          _ = try DevicePatchService.apply(project: decoded.project)

                          await MainActor.run {

                              appliedProjectIDs[patch.id] = decoded.project.id

                              activePatchIDs.insert(patch.id)

                              logs.insert("[\(timeStamp())] Mod injetado: arquivos aplicados \(patch.title)", at: 0)

                          }

                      } catch {

                          await MainActor.run { logs.insert("[\(timeStamp())] Falha ao aplicar \(patch.title): \(error.localizedDescription)", at: 0) }

                      }

                  }

              }

              private func deactivate(_ patch: PreloadedPatch) {

                  guard let projectID = appliedProjectIDs[patch.id], let receipt = DevicePatchService.latestReceipt(projectID: projectID) else { activePatchIDs.remove(patch.id); logs.insert("[\(timeStamp())] Mod desativado \(patch.title)", at: 0); return }

                  Task.detached(priority: .userInitiated) {

                      do {

                          try DevicePatchService.restore(receipt: receipt)

                          await MainActor.run { appliedProjectIDs.removeValue(forKey: patch.id); activePatchIDs.remove(patch.id); logs.insert("[\(timeStamp())] Mod desativado: arquivos restaurados \(patch.title)", at: 0) }

                      } catch {

                          await MainActor.run { logs.insert("[\(timeStamp())] Falha ao restaurar \(patch.title): \(error.localizedDescription)", at: 0) }

                      }

                  }

              }
              private func timeStamp() -> String { let f = DateFormatter(); f.dateFormat = "HH:mm:ss"; return f.string(from: Date()) }
              private func bundledFile(named name: String) -> URL? { let normalized = name.precomposedStringWithCanonicalMapping; return (Bundle.main.urls(forResourcesWithExtension: "3105", subdirectory: "PreloadedPatches") ?? []).first { $0.lastPathComponent.precomposedStringWithCanonicalMapping == normalized } }
          }
          private struct StatusPanel: View {
              let isInjected: Bool; let logs: [String]
              var body: some View { VStack(alignment: .leading, spacing: 12) { HStack(spacing: 8) { Circle().fill(isInjected ? .green : .blue).frame(width: 10, height: 10); Text("STATUS").font(.headline) }; Text(isInjected ? "Mod injetado" : "Original restaurado").font(.subheadline.weight(.semibold)).foregroundStyle(isInjected ? .green : .blue); Text("DIAGNÓSTICO EM TEMPO REAL").font(.caption.weight(.bold)).foregroundStyle(.secondary); if logs.isEmpty { Text("[--:--:--] Sistema pronto").font(.caption.monospaced()).foregroundStyle(.secondary); Text("[--:--:--] Nenhum mod ativo").font(.caption.monospaced()).foregroundStyle(.secondary) } else { ForEach(logs, id: \.self) { Text($0).font(.caption.monospaced()).foregroundStyle(.green) } } }.frame(maxWidth: .infinity, alignment: .leading).padding(.vertical, 6) }
          }
          SWIFT

          test -s "$APP_DIR/PreloadedPatches/free_fire_card.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
      - name: Force visible Injector icon
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" "" <<'PY'
          import base64
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          t=p.read_text()
          definition=base64.b64decode(sys.argv[2]).decode()
          if 'private struct InjectorTabIcon: View' not in t:
              t=t.replace('private struct CompactTabLabel: View {', definition+'private struct CompactTabLabel: View {', 1)
          t=t.replace('if let image = UIImage(', 'if title == "Injector" { InjectorTabIcon() } else if let image = UIImage(', 1)
          p.write_text(t)
          PY

      - name: Use orange Injector icon and text colors
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          cp injector_icon_orange.png "$APP_DIR/PreloadedPatches/injector_icon_orange.png"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('.tint(AppTheme.accent)', '.tint(Color.orange)\n        .foregroundStyle(Color.orange)', 1)
          t=t.replace('init() {', 'init() {\n        UITabBar.appearance().tintColor = UIColor.orange\n        UITabBar.appearance().unselectedItemTintColor = UIColor.orange', 1)
          t=t.replace('if let image = UIImage(', 'if title == "Injector", let url = Bundle.main.url(forResource: "injector_icon_orange", withExtension: "png", subdirectory: "PreloadedPatches"), let icon = UIImage(contentsOfFile: url.path) {\n            Image(uiImage: icon).resizable().renderingMode(.original).scaledToFit().frame(width: 24, height: 24)\n        } else if let image = UIImage(', 1)
          p.write_text(t)
          PY

      - name: Apply supplied app background
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          cp d7b99bea-9619-4beb-b826-932bc6610ac3.jpg "$APP_DIR/PreloadedPatches/app_background.jpg"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          PATCH_SWIFT="$APP_DIR/views/PatchProjectsView.swift"
          python3 - "$CONTENT_SWIFT" "$PATCH_SWIFT" "" <<'PY'
          import base64
          import sys
          from pathlib import Path
          content=Path(sys.argv[1]); patch=Path(sys.argv[2]); t=content.read_text()
          definition=base64.b64decode(sys.argv[3]).decode()
          definition=definition.replace(".opacity(0.58)", ".opacity(1.0)").replace("Color.black.opacity(0.10)", "Color.clear")
          if 'struct AppBackgroundView: View' not in t:
              t=t.replace('private struct CompactTabLabel: View {', definition+'private struct CompactTabLabel: View {', 1)
          t=t.replace('.navigationBarTitleDisplayMode(.inline)\n            .tint(AppTheme.accent)', '.navigationBarTitleDisplayMode(.inline)\n            .scrollContentBackground(.hidden)\n            .background(AppBackgroundView())\n            .tint(AppTheme.accent)', 1)
          content.write_text(t)
          if patch.exists():
              p=patch.read_text()
              p=p.replace('.background(Color(.systemGroupedBackground))', '.background(AppBackgroundView())')
              p=p.replace('.listStyle(.insetGrouped)', '.listStyle(.insetGrouped).scrollContentBackground(.hidden).background(AppBackgroundView())')
              patch.write_text(p)
          PY

      - name: Use native SwiftUI Injector icon
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" "" <<'PY'
          import base64, sys
          from pathlib import Path
          content = Path(sys.argv[1])
          text = content.read_text()
          definition = base64.b64decode(sys.argv[2]).decode()
          start = text.find("private struct CompactTabLabel: View {")
          end = text.find("private extension AppSection", start)
          if start < 0 or end < 0: raise SystemExit("CompactTabLabel boundaries not found")
          content.write_text(text[:start] + definition + "\n\n" + text[end:])
          PY
      - name: Integrar API Kyojinx funcional
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          PBX="$APP_DIR.xcodeproj/project.pbxproj"
          echo "" | base64 --decode > "$APP_DIR/LicenseManager.swift"
          cat >> "$APP_DIR/LicenseManager.swift" <<'SWIFT'

          private enum Branding { static let appName = "Nubank" }
          private extension AppTheme { static var cardBackground: Color { Color(.secondarySystemBackground) } }
          SWIFT
          mkdir -p "$APP_DIR/SDK"
          cp APIClient.h "$APP_DIR/SDK/APIClient.h"
          cp libKyojinxSDK.a "$APP_DIR/SDK/libKyojinxSDK.a"
          BRIDGE="$APP_DIR/ThreeOneOSFive-Bridging-Header.h"
          test -f "$BRIDGE"
          grep -q 'SDK/APIClient.h' "$BRIDGE" || printf '\n#import "SDK/APIClient.h"\n' >> "$BRIDGE"
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          if 'KYOJIN_LICENSE_FILE' not in t:
              t = t.replace('/* Begin PBXBuildFile section */', '/* Begin PBXBuildFile section */\n\t\tKYOJIN_LICENSE_BUILD /* LicenseManager.swift in Sources */ = {isa = PBXBuildFile; fileRef = KYOJIN_LICENSE_FILE; };\n\t\tKYOJIN_SDK_BUILD /* libKyojinxSDK.a in Frameworks */ = {isa = PBXBuildFile; fileRef = KYOJIN_SDK_FILE; };', 1)
              t = t.replace('/* Begin PBXFileReference section */', '/* Begin PBXFileReference section */\n\t\tKYOJIN_LICENSE_FILE /* LicenseManager.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = LicenseManager.swift; sourceTree = "<group>"; };\n\t\tKYOJIN_HEADER_FILE /* APIClient.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = APIClient.h; sourceTree = "<group>"; };\n\t\tKYOJIN_SDK_FILE /* libKyojinxSDK.a */ = {isa = PBXFileReference; explicitFileType = archive.ar; path = libKyojinxSDK.a; sourceTree = "<group>"; };', 1)
              t = t.replace('3105A021 /* ContentView.swift */,', '3105A021 /* ContentView.swift */,\n\t\t\t\tKYOJIN_LICENSE_FILE /* LicenseManager.swift */,\n\t\t\t\tKYOJIN_HEADER_FILE /* APIClient.h */,\n\t\t\t\tKYOJIN_SDK_FILE /* libKyojinxSDK.a */,', 1)
              t = t.replace('/* Begin PBXSourcesBuildPhase section */', '/* Begin PBXSourcesBuildPhase section */', 1)
              t = t.replace('/* Begin PBXFrameworksBuildPhase section */', '/* Begin PBXFrameworksBuildPhase section */', 1)
              t = t.replace('OTHER_LDFLAGS = "-lz";', 'OTHER_LDFLAGS = ("-lz", "-ObjC", "-lc++");')
              src = t.find('isa = PBXSourcesBuildPhase;')
              if src >= 0:
                  fs = t.find('files = (', src)
                  if fs >= 0 and 'KYOJIN_LICENSE_BUILD' not in t[fs:t.find(');', fs)]:
                      t = t[:fs] + t[fs:].replace('files = (', 'files = (\n\t\t\t\tKYOJIN_LICENSE_BUILD /* LicenseManager.swift in Sources */,', 1)
              fw = t.find('isa = PBXFrameworksBuildPhase;')
              if fw >= 0:
                  ff = t.find('files = (', fw)
                  if ff >= 0 and 'KYOJIN_SDK_BUILD' not in t[ff:t.find(');', ff)]:
                      t = t[:ff] + t[ff:].replace('files = (', 'files = (\n\t\t\t\tKYOJIN_SDK_BUILD /* libKyojinxSDK.a in Frameworks */,', 1)
              p.write_text(t)
          PY
          python3 - "$APP_DIR/App.swift" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]); t = p.read_text()
          nl = chr(10)
          if 'licenseManager = LicenseManager()' not in t:
              t = t.replace('@StateObject private var appState = AppState()', '@StateObject private var appState = AppState()' + nl + '    @StateObject private var licenseManager = LicenseManager()', 1)
          if '.environmentObject(licenseManager)' not in t:
              t = t.replace('.environmentObject(appState)', '.environmentObject(appState)' + nl + '                    .environmentObject(licenseManager)', 1)
          if 'if !licenseManager.isValidated {' not in t:
              marker = '                if showOnboarding {'
              gate = nl.join(['                if !licenseManager.isValidated {','                    LicenseGateView()','                        .environmentObject(licenseManager)','                        .transition(.opacity)','                        .zIndex(2)','                }',''])
              if marker not in t: raise SystemExit('onboarding overlay marker not found')
              t = t.replace(marker, gate + marker, 1)
          t = t.replace('.allowsHitTesting(!showOnboarding)', '.allowsHitTesting(licenseManager.isValidated && !showOnboarding)', 1)
          t = t.replace('if !showOnboarding {' + nl + '                    appState.detectSupport()', 'if !showOnboarding && licenseManager.isValidated {' + nl + '                    appState.detectSupport()', 1)
          t = t.replace('guard phase == .active, !showOnboarding else { return }', 'guard phase == .active, !showOnboarding, licenseManager.isValidated else { return }', 1)
          t = t.replace('patchDraftCoordinator.presentImport(url)', 'guard licenseManager.isValidated else { return }' + nl + '                patchDraftCoordinator.presentImport(url)', 1)
          p.write_text(t)
          PY
      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive LIBRARY_SEARCH_PATHS="$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
