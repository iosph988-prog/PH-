                      VStack(alignment: .leading, spacing: 5) {
                          Text(remoteTitle ?? patch.title)
                              .font(.title3.weight(.bold))
                              .foregroundStyle(Color.patchPrimaryText)
                          Text(description)
                              .font(.subheadline)
                              .foregroundStyle(Color.patchSecondaryText)
                              .lineLimit(2)
                      }
                      Spacer(minLength: 8)
                      Toggle("", isOn: Binding(
                          get: { isActive },
                          set: { enabled in
                              guard !isWorking else { return }
                              if enabled { applyPatch() } else { restorePatch() }
                          }
                      ))
                      .labelsHidden()
                      .toggleStyle(PatchToggleStyle())
                  }
                  .padding(.horizontal, compact ? 12 : 18)
                  .padding(.vertical, compact ? 10 : 22)
                  .frame(maxWidth: .infinity, minHeight: compact ? 72 : 104, alignment: .leading)
                  .background(Color.patchCardBackground, in: RoundedRectangle(cornerRadius: 24, style: .continuous))
                  .overlay(RoundedRectangle(cornerRadius: 24, style: .continuous).stroke(Color.patchBorder, lineWidth: 1))
                  .opacity(isWorking ? 0.65 : 1)
                  .onAppear {
                      synchronizeAppliedState()
                      loadRemoteTitle()
                  }
                  .onReceive(NotificationCenter.default.publisher(for: UIApplication.didBecomeActiveNotification)) { _ in
                      loadRemoteTitle()
                  }
                  .alert("Patch", isPresented: Binding(get: { alertMessage != nil }, set: { if !$0 { alertMessage = nil } })) {
                      Button("OK", role: .cancel) { alertMessage = nil }
                  } message: {
                      Text(alertMessage ?? "")
                  }
              }

              private func loadRemoteTitle() {
                  Task {
                      let title = await RemotePatchAPI.title(for: patch)
                      await MainActor.run {
                          if let title, !title.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                              remoteTitle = title
                          }
                      }
                  }
              }

              private func applyPatch() {
                  isWorking = true
                  Task {
                      do {
                          guard let url = await RemotePatchAPI.resolve(patch: patch) ?? bundledFile(named: patch.fileName) else {
                              throw NSError(domain: "RemotePatch", code: 404, userInfo: [NSLocalizedDescriptionKey: "Arquivo não encontrado: \(patch.fileName)"])
                          }
                          let data = try PatchProjectLibrary.readPackage(at: url)
                          let decoded = try PatchPackageCodec.decode(data, password: nil)
                          let newReceipt = try DevicePatchService.apply(project: decoded.project)
                          await MainActor.run {
                              activeReceipt = newReceipt
                              isActive = true
                              isWorking = false
                          }
                      } catch {
                          await MainActor.run {
                              isWorking = false
                              alertMessage = error.localizedDescription
                          }
                      }
                  }
              }

              private func restorePatch() {
                  let currentReceipt = activeReceipt ?? findAppliedProjectID().flatMap { DevicePatchService.latestReceipt(projectID: $0) }
                  guard let currentReceipt else {
                      isActive = false
                      return
                  }
                  isWorking = true
                  Task.detached(priority: .userInitiated) {
                      do {
                          try DevicePatchService.restore(receipt: currentReceipt)
                          await MainActor.run {
                              activeReceipt = nil
                              isActive = false
                              isWorking = false
                          }
                      } catch {
                          await MainActor.run {
                              isWorking = false
                              alertMessage = error.localizedDescription
                          }
                      }
                  }
              }

              private func synchronizeAppliedState() {
                  guard let projectID = findAppliedProjectID() else { return }
                  let latest = DevicePatchService.latestReceipt(projectID: projectID)
                  activeReceipt = latest
                  isActive = latest != nil
              }
              private func findAppliedProjectID() -> UUID? {
                  guard let url = RemotePatchAPI.cachedFile(named: patch.fileName) ?? bundledFile(named: patch.fileName), let data = try? PatchProjectLibrary.readPackage(at: url), let decoded = try? PatchPackageCodec.decode(data, password: nil) else { return nil }
                  return decoded.project.id
              }

              private func bundledFile(named name: String) -> URL? {
                  let normalized = name.precomposedStringWithCanonicalMapping
                  return EmbeddedPatchStore.allPatchURLs().first {
                      $0.pathExtension == "3105" && $0.lastPathComponent.precomposedStringWithCanonicalMapping == normalized
                  }
              }
          }

          private struct RemotePatchDescriptor: Decodable {
              let title: String?
              let fileName: String
              let sha256: String
              let sizeBytes: Int
              let downloadUrl: String
          }

          private struct RemotePatchCatalogResponse: Decodable {
              let valid: Bool
              let patches: [RemotePatchDescriptor]?
          }

          private enum RemotePatchAPI {
              private static let catalogURL = URL(string: "https://apikeydash-rhz9ayn4.manus.space/api/patches/catalog")!

              static func cachedFile(named name: String) -> URL? {
                  let directory = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("RemotePatches", isDirectory: true)
                  let url = directory.appendingPathComponent(name)
                  return FileManager.default.fileExists(atPath: url.path) ? url : nil
              }

              static func title(for patch: PreloadedPatch) async -> String? {
                  await descriptor(for: patch)?.title
              }

              private static func descriptor(for patch: PreloadedPatch) async -> RemotePatchDescriptor? {
                  guard let key = LicenseStore.storedKey else { return nil }
                  do {
                      var request = URLRequest(url: catalogURL, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      let deviceID = UIDevice.current.identifierForVendor?.uuidString ?? "unknown-device"
                      let packageName = Bundle.main.bundleIdentifier ?? "unknown.bundle"
                      let appVersion = Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0"
                      request.httpBody = try JSONSerialization.data(withJSONObject: ["key": key.trimmingCharacters(in: .whitespacesAndNewlines).uppercased(), "device_id": deviceID, "package": packageName, "app_version": appVersion])
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { return nil }
                      let catalog = try JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data)
                      return catalog.valid ? catalog.patches?.first(where: { $0.fileName.precomposedStringWithCanonicalMapping == patch.fileName.precomposedStringWithCanonicalMapping }) : nil
                  } catch {
                      return nil
                  }
              }

              static func resolve(patch: PreloadedPatch) async -> URL? {
                  do {
                      guard let descriptor = await descriptor(for: patch), let url = URL(string: descriptor.downloadUrl) else { return cachedFile(named: patch.fileName) }
                      let (fileData, fileResponse) = try await URLSession.shared.data(from: url)
                      guard let fileHTTP = fileResponse as? HTTPURLResponse, (200..<300).contains(fileHTTP.statusCode), fileData.count == descriptor.sizeBytes else { return cachedFile(named: patch.fileName) }
                      let digest = SHA256.hash(data: fileData).map { String(format: "%02x", $0) }.joined()
                      guard digest.caseInsensitiveCompare(descriptor.sha256) == .orderedSame else { return cachedFile(named: patch.fileName) }
                      let directory = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("RemotePatches", isDirectory: true)
                      try FileManager.default.createDirectory(at: directory, withIntermediateDirectories: true)
                      let destination = directory.appendingPathComponent(patch.fileName)
                      try fileData.write(to: destination, options: .atomic)
                      return destination
                  } catch {
                      return cachedFile(named: patch.fileName)
                  }
              }
          }

