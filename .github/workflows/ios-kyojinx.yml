          private struct CompactPatchCard: View {
              let feature: CompactFeature
              @ObservedObject var store: PatchProjectStore
              let darkMode: Bool
              @State private var isActive = false
              @State private var activeReceipt: PatchTransactionReceipt?
              @State private var isWorking = false
              @State private var alertMessage: String?
              @State private var activationToken = UUID()

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: feature.icon)
                          .font(.system(size: 20, weight: .semibold))
                          .foregroundStyle(darkMode ? .white : .black)
                          .frame(width: 30)
                      VStack(alignment: .leading, spacing: 3) {
                          Text(feature.title).font(.system(size: 15, weight: .bold)).foregroundStyle(darkMode ? .white : .black)
                          Text(feature.subtitle).font(.system(size: 11, weight: .medium)).foregroundStyle(darkMode ? Color.white.opacity(0.55) : Color.black.opacity(0.55)).lineLimit(2)
                      }
                      Spacer(minLength: 4)
                      Toggle("", isOn: Binding(get: { isActive }, set: { on in
                          guard !isWorking else { return }
                          if on { applyPatch() } else { restorePatch() }
                      }))
                      .labelsHidden()
                      .tint(darkMode ? .white : .black)
                  }
                  .padding(.horizontal, 14)
                  .frame(minHeight: 72)
                  .background(darkMode ? Color.white.opacity(0.10) : .white, in: RoundedRectangle(cornerRadius: 16, style: .continuous))
                  .overlay(RoundedRectangle(cornerRadius: 16, style: .continuous).stroke((darkMode ? Color.white : Color.black).opacity(0.10), lineWidth: 1))
                  .opacity(isWorking ? 0.6 : 1)
                  .onAppear { synchronizeAppliedState() }
                  .alert("Patch", isPresented: Binding(get: { alertMessage != nil }, set: { if !$0 { alertMessage = nil } })) {
                      Button("OK", role: .cancel) { alertMessage = nil }
                  } message: { Text(alertMessage ?? "") }
              }

                  private func applyPatch() {
                      isWorking = true
                      let token = UUID()
                      activationToken = token
                      Task {
                          do {
                              guard let url = await RemotePatchAPI.resolve(patch: feature.patch) else {
                                  throw NSError(domain: "RemotePatch", code: 404, userInfo: [NSLocalizedDescriptionKey: "Arquivo não encontrado online: \(feature.patch.fileName)"])
                              }
                          let data = try PatchProjectLibrary.readPackage(at: url)
                          let decoded = try PatchPackageCodec.decode(data, password: nil)
                          let receipt = try DevicePatchService.apply(project: decoded.project)
                          await MainActor.run { activeReceipt = receipt; isActive = true; isWorking = false }
                          try? await Task.sleep(nanoseconds: 5_000_000_000)
                          await MainActor.run {
                              guard activationToken == token, isActive else { return }
                              restorePatch()
                          }
                      } catch {
                          await MainActor.run { isWorking = false; alertMessage = error.localizedDescription }
                      }
                  }
              }

              private func restorePatch() {
                  activationToken = UUID()
                  guard let receipt = activeReceipt ?? findAppliedProjectID().flatMap({ DevicePatchService.latestReceipt(projectID: $0) }) else { isActive = false; return }
                  isWorking = true
                  Task.detached(priority: .userInitiated) {
                      do {
                          try DevicePatchService.restore(receipt: receipt)
                          await MainActor.run { activeReceipt = nil; isActive = false; isWorking = false }
                      } catch {
                          await MainActor.run { isWorking = false; alertMessage = error.localizedDescription }
                      }
                  }
              }

              private func synchronizeAppliedState() {
                  guard let projectID = findAppliedProjectID() else { return }
                  let latest = DevicePatchService.latestReceipt(projectID: projectID)
                  activeReceipt = latest
                  isActive = latest != nil
              }

              private func findAppliedProjectID() -> UUID? {
                  guard let url = RemotePatchAPI.cachedFile(named: feature.patch.fileName), let data = try? PatchProjectLibrary.readPackage(at: url), let decoded = try? PatchPackageCodec.decode(data, password: nil) else { return nil }
                  return decoded.project.id
              }
          }

          private struct RemotePatchDescriptor: Decodable {
              let id: Int
              let slug: String
              let title: String?
              let game: String
              let fileName: String
              let sha256: String
              let sizeBytes: Int
              let downloadUrl: String
              let interfaceTab: String?
              let section: String?
          }

          private struct RemoteAnnouncement: Decodable {
              let freeFireLogoUrl: String
              let freeFireMaxLogoUrl: String
          }

          private struct RemotePatchCatalogResponse: Decodable {
              let valid: Bool
              let patches: [RemotePatchDescriptor]?
          }

          private enum RemotePatchAPI {
              private static let catalogURL = URL(string: String(data: Data(base64Encoded: "aHR0cHM6Ly9hcGktcHJvZHVjdGlvbi0xODJjLnVwLnJhaWx3YXkuYXBwL2FwaS9wYXRjaGVzL2NhdGFsb2c=")!, encoding: .utf8)!)!
              private static let announcementURL = URL(string: String(data: Data(base64Encoded: "aHR0cHM6Ly9hcGktcHJvZHVjdGlvbi0xODJjLnVwLnJhaWx3YXkuYXBwL2FwaS9hbm5vdW5jZW1lbnQ=")!, encoding: .utf8)!)!
              static func cachedFile(named name: String) -> URL? {
                  let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("RemotePatches", isDirectory: true)
                  let url = dir.appendingPathComponent(name)
                  return FileManager.default.fileExists(atPath: url.path) ? url : nil
              }
              static func fetchLogos() async -> [String: String] {
                  do {
                      let (data, response) = try await URLSession.shared.data(from: announcementURL)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { return [:] }
                      let announcement = try JSONDecoder().decode(RemoteAnnouncement.self, from: data)
                      let freeFire = announcement.freeFireLogoUrl.trimmingCharacters(in: .whitespacesAndNewlines)
                      let freeFireMax = announcement.freeFireMaxLogoUrl.trimmingCharacters(in: .whitespacesAndNewlines)
                      return [
                          "free-fire": freeFire.isEmpty ? "https://www.mediafire.com/convkey/ac33/8hej9hlezr3bgjm5g.jpg" : freeFire,
                          "free-fire-max": freeFireMax.isEmpty ? "https://www.mediafire.com/convkey/8df6/7ecmqoxldlbnhm85g.jpg" : freeFireMax
                      ]
                  } catch { return [:] }
              }
              static func fetchCatalog() async -> [RemotePatchDescriptor]? {
                  guard let key = LicenseStore.storedKey else { return nil }
                  do {
                      var request = URLRequest(url: catalogURL, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      request.httpBody = try JSONSerialization.data(withJSONObject: ["key": key.trimmingCharacters(in: .whitespacesAndNewlines).uppercased(), "device_id": UIDevice.current.identifierForVendor?.uuidString ?? "unknown-device", "package": Bundle.main.bundleIdentifier ?? "unknown.bundle", "app_version": Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0", "catalog": "online"])
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid else { return nil }
                      return catalog.patches
                  } catch { return nil }
              }
              static func resolve(patch: PreloadedPatch) async -> URL? {
                  guard let key = LicenseStore.storedKey else { return cachedFile(named: patch.fileName) }
                  do {
                      var request = URLRequest(url: catalogURL, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      request.httpBody = try JSONSerialization.data(withJSONObject: ["key": key.trimmingCharacters(in: .whitespacesAndNewlines).uppercased(), "device_id": UIDevice.current.identifierForVendor?.uuidString ?? "unknown-device", "package": Bundle.main.bundleIdentifier ?? "unknown.bundle", "app_version": Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0"])
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid, let descriptor = catalog.patches?.first(where: { $0.fileName.precomposedStringWithCanonicalMapping == patch.fileName.precomposedStringWithCanonicalMapping }), let url = URL(string: descriptor.downloadUrl) else { return cachedFile(named: patch.fileName) }
                      let (fileData, fileResponse) = try await URLSession.shared.data(from: url)
                      guard let fileHTTP = fileResponse as? HTTPURLResponse, (200..<300).contains(fileHTTP.statusCode), fileData.count == descriptor.sizeBytes else { return cachedFile(named: patch.fileName) }
                      let digest = SHA256.hash(data: fileData).map { String(format: "%02x", $0) }.joined()
                      guard digest.caseInsensitiveCompare(descriptor.sha256) == .orderedSame else { return cachedFile(named: patch.fileName) }
                      let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("RemotePatches", isDirectory: true)
                      try FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                      let destination = dir.appendingPathComponent(patch.fileName)
                      try fileData.write(to: destination, options: .atomic)
                      return destination
                  } catch { return cachedFile(named: patch.fileName) }
              }
          }
