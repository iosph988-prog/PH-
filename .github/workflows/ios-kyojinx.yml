                  .overlay(RoundedRectangle(cornerRadius: 16, style: .continuous).stroke(cyan, lineWidth: 1.7))
                  .shadow(color: cyan.opacity(0.22), radius: 9)
              }

              private func startButton(title: String, icon: String, available: Bool, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      HStack(spacing: 12) {
                          Image(systemName: icon).font(.system(size: 20, weight: .bold))
                          Text(title).font(.system(size: 17, weight: .black, design: .rounded)).tracking(0.5)
                          Spacer()
                          Image(systemName: "chevron.right").font(.system(size: 17, weight: .bold))
                      }
                      .foregroundStyle(.white)
                      .padding(.horizontal, 18)
                      .frame(height: 68)
                      .frame(maxWidth: .infinity)
                      .background(red, in: RoundedRectangle(cornerRadius: 16, style: .continuous))
                      .shadow(color: red.opacity(0.34), radius: 10, y: 5)
                  }
                  .buttonStyle(.plain)
                  .opacity(available && !isWorking ? 1 : 0.48)
                  .disabled(!available || isWorking)
              }

              private func loadCatalog() async {
                  guard let catalog = await RemotePatchAPI.fetchCatalog() else {
                      await MainActor.run { status = "Faça login para carregar as opções MISC." }
                      return
                  }
                  let misc = catalog.filter { item in
                      let tab = item.interfaceTab?.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                      return tab == "MISC" || (item.title ?? "").uppercased().contains("MISC")
                  }
                  await MainActor.run {
                      normalItem = misc.first { !$0.game.lowercased().contains("max") }
                      maxItem = misc.first { $0.game.lowercased().contains("max") }
                      if normalItem == nil && maxItem == nil {
                          status = "Nenhum pacote MISC publicado na API."
                      } else {
                          status = "Pronto para preparar o Free Fire."
                      }
                  }
              }

              private func activate(game: String) async {
                  guard !isWorking else { return }
                  let item = game == "free-fire-max" ? maxItem : normalItem
                  guard let item else {
                      await MainActor.run { status = "Pacote MISC não publicado para este jogo." }
                      return
                  }
                  await MainActor.run { isWorking = true; status = "Baixando e validando..." }
                  do {
                      let localURL = try await download(item: item)
                      let packageData = try PatchProjectLibrary.readPackage(at: localURL)
                      let decoded = try PatchPackageCodec.decode(packageData, password: nil)
                      _ = try DevicePatchService.apply(project: decoded.project)
                      await MainActor.run {
                          if game == "free-fire-max" { maxApplied = true } else { normalApplied = true }
                          activeGame = game
                          isWorking = false
                          status = game == "free-fire-max" ? "MAX aplicado." : "Normal aplicado."
                      }
                  } catch {
                      await MainActor.run { isWorking = false; status = "Não foi possível preparar: \\(error.localizedDescription)" }
                  }
              }

              private func download(item: RemotePatchDescriptor) async throws -> URL {
                  guard let url = URL(string: item.downloadUrl) else { throw URLError(.badURL) }
                  let (data, response) = try await URLSession.shared.data(from: url)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { throw URLError(.badServerResponse) }
                  guard data.count == item.sizeBytes else { throw NSError(domain: "MISC", code: 422, userInfo: [NSLocalizedDescriptionKey: "O pacote MISC foi baixado incompleto."]) }
                  let digest = SHA256.hash(data: data).map { String(format: "%02x", $0) }.joined()
                  guard digest.caseInsensitiveCompare(item.sha256) == .orderedSame else { throw NSError(domain: "MISC", code: 422, userInfo: [NSLocalizedDescriptionKey: "A integridade do pacote MISC não confere."]) }
                  let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("MiscCatalog", isDirectory: true)
                  try FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  let localURL = dir.appendingPathComponent(item.fileName)
                  try data.write(to: localURL, options: .atomic)
                  return localURL
              }

              private func restoreAndClear() async {
                  guard !isWorking else { return }
                  await MainActor.run { isWorking = true; status = "Restaurando aplicações..." }
                  do {
                      let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("MiscCatalog", isDirectory: true)
                      for item in [normalItem, maxItem].compactMap({ $0 }) {
                          let localURL = dir.appendingPathComponent(item.fileName)
                          guard FileManager.default.fileExists(atPath: localURL.path) else { continue }
                          let packageData = try PatchProjectLibrary.readPackage(at: localURL)
                          let decoded = try PatchPackageCodec.decode(packageData, password: nil)
                          if let receipt = DevicePatchService.latestReceipt(projectID: decoded.project.id) {
                              try DevicePatchService.restore(receipt: receipt)
                          }
                      }
                      try? FileManager.default.removeItem(at: dir)
                      await MainActor.run {
                          normalApplied = false
                          maxApplied = false
                          activeGame = nil
                          isWorking = false
                          status = "Aplicações MISC restauradas."
                      }
                  } catch {
                      await MainActor.run { isWorking = false; status = "Não foi possível restaurar: \(error.localizedDescription)" }
                  }
              }
          }
          SWIFTMISC
          python3 - "$NAV_SWIFT" "$CONTENT_SWIFT" <<'PYMISC'
          from pathlib import Path
          import sys
          nav, content = map(Path, sys.argv[1:])
          n = nav.read_text()
          if '    case misc\n' not in n:
              if '    case texture\n' in n:
                  n = n.replace('    case texture\n', '    case texture\n    case misc\n', 1)
              else:
                  raise SystemExit('texture enum case not found')
          n = n.replace('case .home, .files, .patches, .external, .texture:', 'case .home, .files, .patches, .external, .texture, .misc:', 1)
          n = n.replace('[.patches, .external, .texture].filter(isVisible)', '[.patches, .external, .texture, .misc].filter(isVisible)')
          nav.write_text(n)
          c = content.read_text()
          if 'case .misc:\n            MiscToolsView()' not in c:
              c = c.replace('        case .texture:\n            TextureOnlineView()', '        case .texture:\n            TextureOnlineView()\n        case .misc:\n            MiscToolsView()', 1)
          c = c.replace('[.patches, .external, .texture]', '[.patches, .external, .texture, .misc]')
          c = c.replace('ForEach([AppSection.patches, .external, .texture])', 'ForEach([AppSection.patches, .external, .texture, .misc])')
          compact = '''              sectionContent(.texture)
                  .tabItem { CompactTabLabel(title: "TEXTURA", systemImage: "paintbrush.fill") }
                  .tag(AppSection.texture.rawValue)
              sectionContent(.misc)
                  .tabItem { CompactTabLabel(title: "MISC", systemImage: "eye.fill") }
                  .tag(AppSection.misc.rawValue)'''
          texture = '''              sectionContent(.texture)
                  .tabItem { CompactTabLabel(title: "TEXTURA", systemImage: "paintbrush.fill") }
                  .tag(AppSection.texture.rawValue)'''
          c = c.replace(texture, compact, 1)
          c = c.replace('case .texture: return "TEXTURA"', 'case .texture: return "TEXTURA"\n        case .misc: return "MISC"', 1)
          c = c.replace('case .texture: return "paintbrush.fill"', 'case .texture: return "paintbrush.fill"\n        case .misc: return "eye.fill"', 1)
          content.write_text(c)
          PYMISC
      - name: Finalize MISC navigation beside TEXTURA
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          NAV_SWIFT="$APP_DIR/helpers/AppTabNavigationState.swift"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          python3 - "$NAV_SWIFT" "$CONTENT_SWIFT" <<'PYMISCFINAL'
          from pathlib import Path
          import re, sys
          nav, content = map(Path, sys.argv[1:])
          n = nav.read_text()
          if "    case misc\n" not in n:
              n = n.replace("    case texture\n", "    case texture\n    case misc\n", 1)
          n = n.replace("[.patches, .external, .texture].filter(isVisible)", "[.patches, .external, .texture, .misc].filter(isVisible)")
          n = n.replace("case .home, .files, .patches, .external, .texture:", "case .home, .files, .patches, .external, .texture, .misc:")
          nav.write_text(n)
          c = content.read_text()
          if "case .misc:\n            MiscToolsView()" not in c:
              c = c.replace("        case .texture:\n            TextureOnlineView()", "        case .texture:\n            TextureOnlineView()\n        case .misc:\n            MiscToolsView()", 1)
          c = c.replace("[.patches, .external, .texture]", "[.patches, .external, .texture, .misc]")
          c = c.replace("ForEach([AppSection.patches, .external, .texture])", "ForEach([AppSection.patches, .external, .texture, .misc])")
          compact = '''    private var compactLayout: some View {
          TabView(selection: tabSelection) {
              sectionContent(.patches)
                  .tabItem { CompactTabLabel(title: "PROXY", systemImage: "scope") }
                  .tag(AppSection.patches.rawValue)
              sectionContent(.external)
                  .tabItem { CompactTabLabel(title: "External", systemImage: "gamecontroller.fill") }
                  .tag(AppSection.external.rawValue)
              sectionContent(.texture)
                  .tabItem { CompactTabLabel(title: "TEXTURA", systemImage: "paintbrush.fill") }
                  .tag(AppSection.texture.rawValue)
              sectionContent(.misc)
                  .tabItem { CompactTabLabel(title: "MISC", systemImage: "eye.fill") }
                  .tag(AppSection.misc.rawValue)
          }
          }
          '''
          c, count = re.subn(r"(?s)    private var compactLayout: some View \{.*?    private var regularLayout", compact + "    private var regularLayout", c, count=1)
          if count == 0:
              raise SystemExit("compact layout not found")
          c = c.replace('case .texture: return "TEXTURA"', 'case .texture: return "TEXTURA"\n        case .misc: return "MISC"', 1)
          c = c.replace('case .texture: return "paintbrush.fill"', 'case .texture: return "paintbrush.fill"\n        case .misc: return "eye.fill"', 1)
          content.write_text(c)
          PYMISCFINAL
      - name: Fix Swift concurrency for generated device identity calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          for name in ("App.swift", "views/PatchProjectsView.swift"):
              path = Path("source/3105-1.1.1/ThreeOneOSFive") / name
              text = path.read_text()
              text = text.replace("UIDevice.current.identifierForVendor?.uuidString", "(await UIDevice.current.identifierForVendor)?.uuidString")
              path.write_text(text)
          PYFIX

      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive LIBRARY_SEARCH_PATHS="$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=2026.10.07 CURRENT_PROJECT_VERSION=20261007 SWIFT_OPTIMIZATION_LEVEL=-O STRIP_INSTALLED_PRODUCT=YES COPY_PHASE_STRIP=YES DEAD_CODE_STRIPPING=YES GCC_GENERATE_DEBUGGING_SYMBOLS=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          if find "$APP" -type f -name '*.dylib' -print -quit | grep -q .; then
            echo 'Unauthorized standalone dylib found in app bundle'
            find "$APP" -type f -name '*.dylib' -print
            exit 1
          fi
          if find "$APP" -type d -path '*/Framework' -print -quit | grep -q .; then
            echo 'Unauthorized singular Framework directory found in app bundle'
            find "$APP" -type d -path '*/Framework' -print
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
      - name: Publish IPA fallback to GitHub Release
        if: ${{ always() && hashFiles('dist/nubank-preloaded-cards.ipa') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ipa-${GITHUB_RUN_ID}"
          gh release create "$TAG" dist/nubank-preloaded-cards.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "IPA Melhorawifi ${GITHUB_RUN_NUMBER}" --notes "Build experimental com perfil Melhorawifi.bpf."
