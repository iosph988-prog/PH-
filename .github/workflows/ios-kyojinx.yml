              private func loadCatalog() async {
                  guard let misc = await RemotePatchAPI.fetchCatalog(section: "misc") else {
                      await MainActor.run { status = "Faça login para carregar as opções MISC." }
                      return
                  }
                  await MainActor.run {
                      normalItem = misc.first { !$0.game.lowercased().contains("max") }
                      maxItem = misc.first { $0.game.lowercased().contains("max") }
                      if normalItem == nil && maxItem == nil {
                          status = "Nenhum pacote MISC publicado na API."
                      } else {
                          status = "Pronto para preparar o Free Fire."
                      }
                  }
              }

              private func activate(game: String) async {
                  guard !isWorking else { return }
                  let item = game == "free-fire-max" ? maxItem : normalItem
                  guard let item else {
                      await MainActor.run { status = "Pacote MISC não publicado para este jogo." }
                      return
                  }
                  await MainActor.run { isWorking = true; status = "Baixando e validando..." }
                  do {
                      let localURL = try await download(item: item)
                      let packageData = try PatchProjectLibrary.readPackage(at: localURL)
                      let decoded = try PatchPackageCodec.decode(packageData, password: nil)
                      _ = try DevicePatchService.apply(project: decoded.project)
                      await MainActor.run {
                          if game == "free-fire-max" { maxApplied = true } else { normalApplied = true }
                          activeGame = game
                          isWorking = false
                          status = game == "free-fire-max" ? "MAX aplicado." : "Normal aplicado."
                      }
                  } catch {
                      await MainActor.run { isWorking = false; status = "Não foi possível preparar: \\(error.localizedDescription)" }
                  }
              }

              private func download(item: RemotePatchDescriptor) async throws -> URL {
                  guard let url = URL(string: item.downloadUrl) else { throw URLError(.badURL) }
                  let (data, response) = try await URLSession.shared.data(from: url)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { throw URLError(.badServerResponse) }
                  guard data.count == item.sizeBytes else { throw NSError(domain: "MISC", code: 422, userInfo: [NSLocalizedDescriptionKey: "O pacote MISC foi baixado incompleto."]) }
                  let digest = SHA256.hash(data: data).map { String(format: "%02x", $0) }.joined()
                  guard digest.caseInsensitiveCompare(item.sha256) == .orderedSame else { throw NSError(domain: "MISC", code: 422, userInfo: [NSLocalizedDescriptionKey: "A integridade do pacote MISC não confere."]) }
                  let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("MiscCatalog", isDirectory: true)
                  try FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  let localURL = dir.appendingPathComponent(item.fileName)
                  try data.write(to: localURL, options: .atomic)
                  return localURL
              }

              private func restoreAndClear() async {
                  guard !isWorking else { return }
                  await MainActor.run { isWorking = true; status = "Restaurando aplicações..." }
                  do {
                      let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("MiscCatalog", isDirectory: true)
                      for item in [normalItem, maxItem].compactMap({ $0 }) {
                          let localURL = dir.appendingPathComponent(item.fileName)
                          guard FileManager.default.fileExists(atPath: localURL.path) else { continue }
                          let packageData = try PatchProjectLibrary.readPackage(at: localURL)
                          let decoded = try PatchPackageCodec.decode(packageData, password: nil)
                          if let receipt = DevicePatchService.latestReceipt(projectID: decoded.project.id) {
                              try DevicePatchService.restore(receipt: receipt)
                          }
                      }
                      try? FileManager.default.removeItem(at: dir)
                      await MainActor.run {
                          normalApplied = false
                          maxApplied = false
                          activeGame = nil
                          isWorking = false
                          status = "Aplicações MISC restauradas."
                      }
                  } catch {
                      await MainActor.run { isWorking = false; status = "Não foi possível restaurar: \(error.localizedDescription)" }
                  }
              }
          }
