permissions:
  contents: write

name: 3105 - Nubank Build Without API
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Update playlist Bundle ID
        shell: bash
        run: |
          set -euo pipefail
          OLD_BUNDLE="com.apple.mobile.MobileHouseArrest"
          NEW_BUNDLE="com.apple.mobile.MobileHouseArrest"
          grep -RIl --exclude='*.zip' "$OLD_BUNDLE" source | xargs -r sed -i.bak "s/$OLD_BUNDLE/$NEW_BUNDLE/g"
          find source -name '*.bak' -delete
          grep -RIl "$NEW_BUNDLE" source | head -20
      - name: Hide legacy URLs from executable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/3105-1.1.1/ThreeOneOSFive")
          app = root / "App.swift"
          app_text = app.read_text()
          helper = """\n\n@inline(never)\nfunc PHDecodeLegacyURL(_ payload: [UInt8]) -> String {\n    let salt = Bundle.main.bundleIdentifier?.utf8.first ?? 0\n    return String(decoding: payload.map { $0 ^ 0x5A ^ salt }, as: UTF8.self)\n}\n"""
          if "func PHDecodeLegacyURL" not in app_text:
              app.write_text(app_text + helper)
          pattern = re.compile(r'"(https?://[^"\\\n]+)"')
          bundle_salt = ord("c")
          raw_domain = "raw.githubusercontent.com"
          raw_encoded = ", ".join(str(b ^ 0x5A ^ bundle_salt) for b in raw_domain.encode("utf-8"))
          for path in root.rglob("*.swift"):
              text = path.read_text()
              def encode(match):
                  value = match.group(1)
                  values = ", ".join(str(b ^ 0x5A ^ bundle_salt) for b in value.encode("utf-8"))
                  return f'PHDecodeLegacyURL([{values}])'
              updated = pattern.sub(encode, text)
              updated = updated.replace('"raw.githubusercontent.com"', f'PHDecodeLegacyURL([{raw_encoded}])')
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches, .external].filter(isVisible)", 1))
          PY
      - name: Add API login gate
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          python3 - "$APP_SWIFT" "" <<'PY'
          import base64, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text()
          addition = base64.b64decode(sys.argv[2]).decode()
          addition = addition.replace("    let activatedAt: String?\n", "    let activatedAt: String?\n    let creatorName: String?\n", 1)
          addition = addition.replace("        case activatedAt = \"activatedAt\"\n", "        case activatedAt = \"activatedAt\"\n        case creatorName = \"creatorName\"\n", 1)
          addition = addition.replace("    let activatedAt: String?\n}\n\nextension LicenseStore", "    let activatedAt: String?\n    let creatorName: String?\n}\n\nextension LicenseStore", 1)
          addition = addition.replace("            activatedAt: response.activatedAt\n", "            activatedAt: response.activatedAt,\n            creatorName: response.creatorName\n", 1)
          addition = addition.replace("private static var storedKey", "static var storedKey", 1)
          addition = addition.replace("}\n\nstruct LicenseProfileSnapshot", "    static func clear() {\n        let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]\n        SecItemDelete(query as CFDictionary)\n    }\n}\n\nstruct LicenseProfileSnapshot", 1)
          t = t.replace('import UIKit\n', 'import UIKit\nimport Security\n', 1)
          t = t.replace('    @State private var showOnboarding = false\n', '    @State private var showOnboarding = false\n    @State private var isLicensed = false\n    @State private var forcedLoginReset = false\n', 1)
          t = t.replace('                    .opacity(showOnboarding ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding)', '                    .opacity(showOnboarding || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && isLicensed)', 1)
          anchor = '                    .zIndex(1)\n                }\n'
          replacement = anchor + '\n                if !showOnboarding && !isLicensed {\n                    LicenseLoginView {\n                        withAnimation(.easeInOut(duration: 0.25)) { isLicensed = true }\n                        appState.detectSupport()\n                        checkForUpdate()\n                    }\n                    .environment(\\.appLanguage, language)\n                    .environment(\\.locale, language.locale)\n                    .zIndex(2)\n                }\n'
          if anchor not in t:
              raise SystemExit('overlay anchor not found')
          t = t.replace(anchor, replacement, 1)
          t = t.replace('            .onAppear {\n                if !showOnboarding {', '            .onAppear {\n                if !showOnboarding && isLicensed {', 1)
          t = t.replace('                guard phase == .active, !showOnboarding else { return }', '                guard phase == .active, !showOnboarding, isLicensed else { return }', 1)
          t += addition
          p.write_text(t)
          PY

      - name: Add calculator unlock screen before API
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          curl -fsSL https://files.manuscdn.com/user_upload_by_module/session_file/310519663912938762/PqdDhCNKFTkScSzG.swift -o /tmp/CalculatorGateView.swift
          python3 - "$APP_SWIFT" /tmp/CalculatorGateView.swift <<'PY'
          from pathlib import Path
          import sys
          app = Path(sys.argv[1])
          component = Path(sys.argv[2]).read_text()
          t = app.read_text()
          if 'private var calculatorUnlocked = false' not in t:
              t = t.replace('    @State private var isLicensed = false\n', '    @State private var isLicensed = false\n    @State private var calculatorUnlocked = false\n', 1)
          t = t.replace('.opacity(showOnboarding || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && isLicensed)', '.opacity(showOnboarding || !calculatorUnlocked || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && calculatorUnlocked && isLicensed)', 1)
          gate = '''                if !showOnboarding && !calculatorUnlocked {
                    CalculatorGateView {
                        withAnimation(.easeInOut(duration: 0.25)) { calculatorUnlocked = true }
                    }
                    .ignoresSafeArea()
                    .zIndex(3)
                }

          '''
          marker = '                if !showOnboarding && !isLicensed {'
          if 'CalculatorGateView {' not in t and marker in t:
              t = t.replace(marker, gate + marker, 1)
          if 'private struct CalculatorGateView' not in t:
              t += '\n' + component
          app.write_text(t)
          PY

      - name: Remove terminal and settings toolbar buttons
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = r"\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showLogs = true \} label: \{\n\s*Image\(systemName: \"apple\.terminal\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_logs\"\)\)\n\s*\}\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showSettings = true \} label: \{\n\s*Image\(systemName: \"gearshape\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_settings\"\)\)\n\s*\}"
          updated, count = re.subn(pattern, "", text, count=1)
          p.write_text(updated if count == 1 else text)
          print(f"removed legacy toolbar block: {count}")
          PY

      - name: Replace GitHub update checker with Railway announcement
        shell: bash
        run: |
          set -euo pipefail
          UTILS_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/Utils.swift
          python3 - <<"PY" "$UTILS_SWIFT"
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()
          replacement = r"""enum AppUpdateChecker {
              static let dismissedVersionKey = "update.dismissedVersion"
              struct Offer: Identifiable { let id = UUID(); let version: String; let url: URL }
              static let apiURL = URL(string: String(data: Data(base64Encoded: "aHR0cHM6Ly9hcGktcHJvZHVjdGlvbi0xODJjLnVwLnJhaWx3YXkuYXBwL2FwaS9hbm5vdW5jZW1lbnQ=")!, encoding: .utf8)!)!
              static func dismiss(version: String) { UserDefaults.standard.set(version, forKey: dismissedVersionKey) }
              static func check() async -> Offer? {
                  do {
                      let (data, response) = try await URLSession.shared.data(from: apiURL)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { return nil }
                      let a = try JSONDecoder().decode(Announcement.self, from: data)
                      guard a.enabled, let url = URL(string: a.url), UserDefaults.standard.string(forKey: dismissedVersionKey) != a.version else { return nil }
                      return Offer(version: a.version, url: url)
                  } catch { return nil }
              }
              private struct Announcement: Decodable { let enabled: Bool; let version: String; let url: String }
          }"""
          updated, count = re.subn(r"enum AppUpdateChecker \{.*\Z", replacement, t, count=1, flags=re.S)
          if count != 1: raise SystemExit("AppUpdateChecker enum not found")
          p.write_text(updated)
          PY
      - name: Set Início and Injector navigation labels
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('title: language.text(section.titleKey)', 'title: section == .home ? "Início" : (section == .external ? "External" : "PROXY")', 1)
          t=t.replace('systemImage: section.systemImage', 'systemImage: section == .home ? "house.fill" : (section == .patches ? "scope" : "gamecontroller.fill")', 1)
          p.write_text(t)
          PY

      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          p.write_text(text2)
          print(f'removed legacy features section call: {text2 != text}')
          PY
      - name: Add External external panel tab
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          NAV_SWIFT="$APP_DIR/helpers/AppTabNavigationState.swift"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          python3 - "$NAV_SWIFT" "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          nav, content = map(Path, sys.argv[1:])
          n = nav.read_text()
          if "    case patches\n" not in n:
              n = n.replace("    case installed\n", "    case patches\n    case external\n    case texture\n", 1)
          else:
              n = n.replace("    case patches\n", "    case patches\n    case external\n    case texture\n", 1)
          n = n.replace("case .home, .files, .patches:", "case .home, .files, .patches, .external, .texture:", 1)
          nav.write_text(n)
          c = content.read_text()
          c = c.replace("AppSection.installed", "AppSection.patches")
          c = c.replace("case .installed:", "case .patches:", 1)
          c = c.replace("case .patches:\n            PatchProjectsView(\n                onOpenSettings: openSettings,\n                onOpenLogs: openLogs\n            )", "case .patches:\n            PatchProjectsView()", 1)
          c = c.replace("        case .patches:\n            PatchProjectsView()", "        case .patches:\n            PatchProjectsView()\n        case .external:\n            ExternalPanelView()\n        case .texture:\n            TextureOnlineView()", 1)
          c = c.replace("        case .installed: return \"tab.installed\"", "        case .patches: return \"Online\"\n        case .external: return \"External\"", 1)
          c = c.replace("        case .installed: return \"tray.full.fill\"", "        case .patches: return \"scope\"\n        case .external: return \"gamecontroller.fill\"", 1)
          c = c.replace("        .patchStorePresentation(patchStore)\n", "", 1)
          content.write_text(c)
          PY

      - name: Add TEXTURA online catalog view
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          mkdir -p "$APP_DIR/views" "$APP_DIR/Assets.xcassets/TextureAlok.imageset" "$APP_DIR/Assets.xcassets/TextureDimitri.imageset"
          cp .github/workflows/texture-ui-assets/alok.png "$APP_DIR/Assets.xcassets/TextureAlok.imageset/alok.png"
          cp .github/workflows/texture-ui-assets/dimitri.png "$APP_DIR/Assets.xcassets/TextureDimitri.imageset/dimitri.png"
          cat > "$APP_DIR/Assets.xcassets/TextureAlok.imageset/Contents.json" <<'JSON'
          {"images":[{"filename":"alok.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > "$APP_DIR/Assets.xcassets/TextureDimitri.imageset/Contents.json" <<'JSON'
          {"images":[{"filename":"dimitri.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > "$APP_DIR/views/TextureOnlineView.swift" <<'SWIFT'
          import SwiftUI
          import UIKit
          import CryptoKit

          private struct TextureCatalogResponse: Decodable {
              let valid: Bool
              let patches: [TextureCatalogItem]?
              let textureBannerUrl: String?
          }

          private struct TextureCatalogItem: Decodable, Identifiable {
              let id: Int
              let title: String
              let fileName: String
              let logoUrl: String?
              let downloadUrl: String
              let sizeBytes: Int
              let sha256: String
          }

          private enum TextureCharacter: String, CaseIterable, Identifiable {
              case alok
              case dimitri

              var id: String { rawValue }
              var title: String { rawValue.capitalized }
              var imageName: String { rawValue == "alok" ? "TextureAlok" : "TextureDimitri" }
          }

          struct TextureOnlineView: View {
              @State private var items: [TextureCatalogItem] = []
              @State private var message = "Carregando texturas online..."
              @State private var activeIDs: Set<Int> = []
              @State private var textureBannerUrl: String?
              @State private var selectedCharacter: TextureCharacter?
              @State private var selectedItemID: Int?
              @State private var isWorking = false
              @State private var pendingPasswordItem: TextureCatalogItem?
              @State private var pendingPasswordURL: URL?
              @State private var texturePassword = ""

              private var selectedItem: TextureCatalogItem? {
                  items.first(where: { $0.id == selectedItemID })
              }

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Color(red: 0.018, green: 0.020, blue: 0.027).ignoresSafeArea()
                          ScrollView(showsIndicators: false) {
                              VStack(alignment: .leading, spacing: 0) {
                                  header
                                      .padding(.bottom, 30)

                                  VStack(alignment: .leading, spacing: 7) {
                                      Text("ESCOLHA SEU PERSONAGEM")
                                          .font(.system(size: 21, weight: .black, design: .rounded))
                                          .tracking(0.45)
                                          .foregroundStyle(.white)
                                      Text("Selecione um card para ver as skins online")
                                          .font(.system(size: 14, weight: .medium))
                                          .foregroundStyle(Color.white.opacity(0.56))
                                  }
                                  .padding(.bottom, 17)

                                  LazyVGrid(columns: [GridItem(.flexible(), spacing: 12), GridItem(.flexible(), spacing: 12)], spacing: 14) {
                                      ForEach(TextureCharacter.allCases) { character in
                                          characterCard(character)
                                      }
                                  }

                                  HStack(spacing: 8) {
                                      if message.hasPrefix("Carregando") {
                                          ProgressView().tint(Color.white.opacity(0.7))
                                      } else {
                                          Circle()
                                              .fill(items.isEmpty ? Color.orange : Color.green)
                                              .frame(width: 7, height: 7)
                                      }
                                      Text(message.isEmpty ? "\(items.count) skins disponíveis online" : message)
                                          .font(.system(size: 12, weight: .medium))
                                          .foregroundStyle(Color.white.opacity(0.56))
                                          .lineLimit(2)
                                      Spacer(minLength: 0)
                                  }
                                  .padding(.top, 19)
                                  .padding(.horizontal, 3)
                              }
                              .padding(.horizontal, 18)
                              .padding(.top, 18)
                              .padding(.bottom, 34)
                          }
                      }
                      .background(Color(red: 0.018, green: 0.020, blue: 0.027))
                      .toolbar(.hidden, for: .navigationBar)
                  }
                  .preferredColorScheme(.dark)
                  .task { await load() }
                  .fullScreenCover(item: $selectedCharacter) { character in
                      catalogScreen(for: character)
                  }
              }

              private var header: some View {
                  HStack(spacing: 11) {
                      Image(systemName: "tshirt.fill")
                          .font(.system(size: 22, weight: .bold))
                          .foregroundStyle(.white)
                          .frame(width: 46, height: 46)
                          .background(Color.white.opacity(0.09), in: RoundedRectangle(cornerRadius: 15, style: .continuous))
                      VStack(alignment: .leading, spacing: 2) {
                          Text("TEXTURA")
                              .font(.system(size: 22, weight: .black, design: .rounded))
                              .tracking(0.7)
                              .foregroundStyle(.white)
                          Text("SKINS E HOLOGRAMAS")
                              .font(.system(size: 10, weight: .bold, design: .rounded))
                              .tracking(1.1)
                              .foregroundStyle(Color.white.opacity(0.52))
                      }
                      Spacer()
                      HStack(spacing: 6) {
                          Circle().fill(Color(red: 0.35, green: 0.91, blue: 0.57)).frame(width: 7, height: 7)
                          Text("LIVE")
                              .font(.system(size: 11, weight: .black, design: .rounded))
                              .tracking(0.7)
                              .foregroundStyle(.white)
                      }
                      .padding(.horizontal, 11)
                      .padding(.vertical, 8)
                      .background(Color.white.opacity(0.08), in: Capsule())
                  }
              }

              private func characterCard(_ character: TextureCharacter) -> some View {
                  Button {
                      selectedItemID = nil
                      selectedCharacter = character
                  } label: {
                      VStack(alignment: .leading, spacing: 0) {
                          ZStack(alignment: .bottomLeading) {
                              Image(character.imageName)
                                  .resizable()
                                  .scaledToFill()
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 176)
                                  .clipped()
                              LinearGradient(colors: [.clear, Color.black.opacity(0.92)], startPoint: .center, endPoint: .bottom)
                              VStack(alignment: .leading, spacing: 4) {
                                  Text(character.title)
                                      .font(.system(size: 20, weight: .bold, design: .rounded))
                                      .foregroundStyle(.white)
                                  Text("Selecionar skins")
                                      .font(.system(size: 12, weight: .medium))
                                      .foregroundStyle(Color.white.opacity(0.68))
                              }
                              .padding(13)
                          }
                          .frame(height: 176)
                          .overlay(alignment: .topTrailing) {
                              Image(systemName: "arrow.up.right")
                                  .font(.system(size: 11, weight: .bold))
                                  .foregroundStyle(.white)
                                  .frame(width: 28, height: 28)
                                  .background(Color.black.opacity(0.52), in: Circle())
                                  .padding(10)
                          }
                      }
                      .background(Color(red: 0.075, green: 0.078, blue: 0.090))
                      .clipShape(RoundedRectangle(cornerRadius: 19, style: .continuous))
                      .overlay(RoundedRectangle(cornerRadius: 19, style: .continuous).stroke(Color.white.opacity(0.11), lineWidth: 1))
                  }
                  .buttonStyle(.plain)
                  .accessibilityLabel("\(character.title), selecionar skins online")
              }

              private func catalogScreen(for character: TextureCharacter) -> some View {
                  ZStack {
                      Color(red: 0.018, green: 0.020, blue: 0.027).ignoresSafeArea()
                      VStack(spacing: 0) {
                          HStack {
                              Button { selectedCharacter = nil } label: {
                                  Image(systemName: "xmark")
                                      .font(.system(size: 14, weight: .bold))
                                      .foregroundStyle(.white)
                                      .frame(width: 38, height: 38)
                                      .background(Color.white.opacity(0.09), in: Circle())
                              }
                              .buttonStyle(.plain)
                              Spacer()
                              HStack(spacing: 6) {
                                  Circle().fill(Color(red: 0.35, green: 0.91, blue: 0.57)).frame(width: 7, height: 7)
                                  Text("ONLINE")
                                      .font(.system(size: 10, weight: .black, design: .rounded))
                                      .tracking(0.8)
                                      .foregroundStyle(Color.white.opacity(0.78))
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 12)
                          .padding(.bottom, 17)

                          VStack(alignment: .leading, spacing: 5) {
                              Text("\(character.title) skins")
                                  .font(.system(size: 27, weight: .black, design: .rounded))
                                  .foregroundStyle(.white)
                              Text("Escolha uma textura disponível online")
                                  .font(.system(size: 13, weight: .medium))
                                  .foregroundStyle(Color.white.opacity(0.55))
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding(.horizontal, 20)
                          .padding(.bottom, 15)

                          if items.isEmpty {
                              VStack(spacing: 10) {
                                  Image(systemName: "square.stack.3d.up")
                                      .font(.system(size: 30, weight: .medium))
                                      .foregroundStyle(Color.white.opacity(0.38))
                                  Text(message)
                                      .font(.system(size: 14, weight: .medium))
                                      .foregroundStyle(Color.white.opacity(0.62))
                                      .multilineTextAlignment(.center)
                              }
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .padding(30)
                          } else {
                              ScrollView(showsIndicators: false) {
                                  LazyVStack(spacing: 10) {
                                      ForEach(items) { item in
                                          textureRow(item, character: character)
                                      }
                                  }
                                  .padding(.horizontal, 18)
                                  .padding(.bottom, 18)
                              }
                          }

                          actionFooter
                      }
                  }
                  .preferredColorScheme(.dark)
                  .alert("Senha da textura", isPresented: Binding(get: { pendingPasswordItem != nil }, set: { visible in
                      if !visible { clearPasswordPrompt() }
                  })) {
                      SecureField("Digite a senha", text: $texturePassword)
                      Button("Cancelar", role: .cancel) { clearPasswordPrompt() }
                      Button("Aplicar") {
                          guard let item = pendingPasswordItem, let url = pendingPasswordURL else { return }
                          let password = texturePassword
                          clearPasswordPrompt()
                          Task { await decodeAndApply(item: item, url: url, password: password) }
                      }
                  } message: {
                      Text("Este pacote TEXTURA está protegido. A senha não é enviada para a API.")
                  }
              }

              private func textureRow(_ item: TextureCatalogItem, character: TextureCharacter) -> some View {
                  let isSelected = selectedItemID == item.id
                  let isActive = activeIDs.contains(item.id)
                  return Button { selectedItemID = item.id } label: {
                      HStack(spacing: 12) {
                          if let raw = item.logoUrl, let url = URL(string: raw) {
                              AsyncImage(url: url) { phase in
                                  if let image = phase.image {
                                      image.resizable().scaledToFill()
                                  } else {
                                      logoPlaceholder
                                  }
                              }
                              .frame(width: 58, height: 58)
                              .clipShape(RoundedRectangle(cornerRadius: 13, style: .continuous))
                          } else {
                              logoPlaceholder
                                  .frame(width: 58, height: 58)
