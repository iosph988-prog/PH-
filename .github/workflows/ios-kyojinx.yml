name: 3105 - Nubank Build Without API
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches].filter(isVisible)", 1))
          PY
      - name: Remove terminal and settings toolbar buttons
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = r"\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showLogs = true \} label: \{\n\s*Image\(systemName: \"apple\.terminal\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_logs\"\)\)\n\s*\}\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showSettings = true \} label: \{\n\s*Image\(systemName: \"gearshape\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_settings\"\)\)\n\s*\}"
          updated, count = re.subn(pattern, "", text, count=1)
          if count != 1:
              raise SystemExit("terminal/settings toolbar block not found")
          p.write_text(updated)
          PY

      - name: Set Início and Injector navigation labels
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('title: language.text(section.titleKey)', 'title: section == .home ? "Início" : "Injector"', 1)
          t=t.replace('systemImage: section.systemImage', 'systemImage: section == .home ? "house.fill" : "rocket.fill"', 1)
          p.write_text(t)
          PY

      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          if text2 == text: raise SystemExit('featuresSection call not found')
          p.write_text(text2)
          PY
      - name: Add preloaded game cards and resources
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          mkdir -p "$APP_DIR/PreloadedPatches"
          cp 6F54F0A3-A7FC-4AED-8E8E-4234D141B85D.png "$APP_DIR/PreloadedPatches/free_fire_card.png"
          cp BC397CF8-956B-49A7-A6BB-772CEEA5217A.png "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
          for f in Hologramarosa\(2\).3105 ESPCORPO.3105 HSALTO.3105 Pescoço\+antenaavatar\(2\).3105 Hologramaverde\(5\).3105 Hologramavermelho\(2\).3105 BALAMAGIC.3105 120FPS\(2\).3105 HSPEITO.3105 Magicavatar\(2\).3105 Hologramazul\(2\).3105 Magiccache\(2\).3105 HSPESÇOCO.3105 Hologramaverde\(4\).3105; do cp "$f" "$APP_DIR/PreloadedPatches/"; done
          PBX=source/3105-1.1.1/ThreeOneOSFive.xcodeproj/project.pbxproj
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          ref='''\t\tA1B2C3D5 /* PreloadedPatches */ = {isa = PBXFileReference; lastKnownFileType = folder; path = PreloadedPatches; sourceTree = "<group>"; };'''
          build='''\t\tA1B2C3D6 /* PreloadedPatches in Resources */ = {isa = PBXBuildFile; fileRef = A1B2C3D5 /* PreloadedPatches */; };'''
          if 'A1B2C3D5' not in t:
              t=t.replace('/* End PBXFileReference section */', ref+'\n/* End PBXFileReference section */')
              t=t.replace('/* End PBXBuildFile section */', build+'\n/* End PBXBuildFile section */')
              t=t.replace('3105A031 /* Assets.xcassets */,', 'A1B2C3D5 /* PreloadedPatches */,\n\t\t\t\t3105A031 /* Assets.xcassets */,')
              t=t.replace('files = (\n\t\t\t\t3105A211,', 'files = (\n\t\t\t\tA1B2C3D6 /* PreloadedPatches in Resources */,\n\t\t\t\t3105A211,')
          p.write_text(t)
          PY
          cat > source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          private struct PreloadedGame: Identifiable {
              let id: String
              let title: String
              let bundleID: String
              let patches: [PreloadedPatch]
          }

          private struct PreloadedPatch: Identifiable, Hashable {
              let id: String
              let title: String
              let fileName: String
              let replacementCount: Int
          }

          private let preloadedGames: [PreloadedGame] = [
              PreloadedGame(
                  id: "free-fire",
                  title: "Free Fire",
                  bundleID: "com.dts.freefireth",
                  patches: [
                      PreloadedPatch(id: "normal-rosa", title: "Hologramarosa", fileName: "Hologramarosa(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-salto-antena", title: "Hsalto + antena", fileName: "HSALTO.3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-peito-cache", title: "ESPCORPO", fileName: "ESPCORPO.3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-magic-cache", title: "Magic cache", fileName: "Magiccache(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-salto-cache", title: "Hsalto cache", fileName: "BALAMAGIC.3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-verde", title: "Holograma verde", fileName: "Hologramaverde(5).3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-peito-avatar", title: "HSPEITO", fileName: "HSPEITO.3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-120fps", title: "120 FPS", fileName: "120FPS(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-pescoco-cache", title: "HSPESCOCO", fileName: "HSPESÇOCO.3105", replacementCount: 1),
                      PreloadedPatch(id: "normal-vermelho", title: "Holograma vermelho", fileName: "Hologramavermelho(2).3105", replacementCount: 1)
                  ]
              ),
              PreloadedGame(
                  id: "free-fire-max",
                  title: "Free Fire MAX",
                  bundleID: "com.dts.freefiremax",
                  patches: [
                      PreloadedPatch(id: "max-verde", title: "Holograma verde", fileName: "Hologramaverde(4).3105", replacementCount: 1),
                      PreloadedPatch(id: "max-azul", title: "Holograma azul", fileName: "Hologramazul(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "max-peito-antena", title: "Pescoço + antena avatar", fileName: "Pescoço+antenaavatar(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "max-magic", title: "Magic avatar", fileName: "Magicavatar(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "max-pescoco", title: "Pescoço + antena avatar", fileName: "Pescoço+antenaavatar(2).3105", replacementCount: 1)
                  ]
              )
          ]

          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore()
              @State private var selectedGameID = "free-fire"

              private var selectedGame: PreloadedGame {
                  preloadedGames.first(where: { $0.id == selectedGameID }) ?? preloadedGames[0]
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 22) {
                              Picker("Jogo", selection: $selectedGameID) {
                                  ForEach(preloadedGames) { game in
                                      Text(game.title).tag(game.id)
                                  }
                              }
                              .pickerStyle(.segmented)
                              .tint(.orange)

                              VStack(spacing: 14) {
                                  ForEach(selectedGame.patches) { patch in
                                      PreloadedPatchCard(patch: patch, store: store)
                                  }
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 20)
                          .padding(.bottom, 28)
                      }
                      .background(AppBackgroundView())
                      .navigationTitle("Patches")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          private struct PreloadedPatchCard: View {
              let patch: PreloadedPatch
              @ObservedObject var store: PatchProjectStore
              @State private var isActive = false
              @State private var isWorking = false
              @State private var alertMessage: String?

              var body: some View {
                  HStack(spacing: 14) {
                      VStack(alignment: .leading, spacing: 7) {
                          Text(patch.title)
                              .font(.title3.weight(.semibold))
                              .foregroundStyle(.primary)
                          Text("\(patch.replacementCount) replacement rules")
                              .font(.body)
                              .foregroundStyle(.secondary)
                      }
                      Spacer(minLength: 8)
                      Toggle("", isOn: Binding(
                          get: { isActive },
                          set: { enabled in
                              guard !isWorking else { return }
                              if enabled { applyPatch() } else { restorePatch() }
                          }
                      ))
                      .labelsHidden()
                      .tint(.orange)
                  }
                  .padding(.horizontal, 22)
                  .padding(.vertical, 22)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(Color(.secondarySystemBackground).opacity(0.96), in: RoundedRectangle(cornerRadius: 28, style: .continuous))
                  .overlay(RoundedRectangle(cornerRadius: 28, style: .continuous).stroke(Color.white.opacity(0.06), lineWidth: 1))
                  .opacity(isWorking ? 0.65 : 1)
                  .alert("Patch", isPresented: Binding(get: { alertMessage != nil }, set: { if !$0 { alertMessage = nil } })) {
                      Button("OK", role: .cancel) { alertMessage = nil }
                  } message: {
                      Text(alertMessage ?? "")
                  }
              }

              private func applyPatch() {
                  guard let url = bundledFile(named: patch.fileName) else {
                      alertMessage = "Arquivo não encontrado: \(patch.fileName)"
                      return
                  }
                  isWorking = true
                  Task.detached(priority: .userInitiated) {
                      do {
                          let data = try PatchProjectLibrary.readPackage(at: url)
                          let decoded = try PatchPackageCodec.decode(data, password: nil)
                          _ = try DevicePatchService.apply(project: decoded.project)
                          await MainActor.run {
                              isActive = true
                              isWorking = false
                          }
                      } catch {
                          await MainActor.run {
                              isWorking = false
                              alertMessage = error.localizedDescription
                          }
                      }
                  }
              }

              private func restorePatch() {
                  guard let projectID = findAppliedProjectID(),
                        let receipt = DevicePatchService.latestReceipt(projectID: projectID) else {
                      isActive = false
                      return
                  }
                  isWorking = true
                  Task.detached(priority: .userInitiated) {
                      do {
                          try DevicePatchService.restore(receipt: receipt)
                          await MainActor.run {
                              isActive = false
                              isWorking = false
                          }
                      } catch {
                          await MainActor.run {
                              isWorking = false
                              alertMessage = error.localizedDescription
                          }
                      }
                  }
              }

              private func findAppliedProjectID() -> UUID? {
                  guard let url = bundledFile(named: patch.fileName), let data = try? PatchProjectLibrary.readPackage(at: url), let decoded = try? PatchPackageCodec.decode(data, password: nil) else { return nil }
                  return decoded.project.id
              }

              private func bundledFile(named name: String) -> URL? {
                  let normalized = name.precomposedStringWithCanonicalMapping
                  return (Bundle.main.urls(forResourcesWithExtension: "3105", subdirectory: "PreloadedPatches") ?? []).first {
                      $0.lastPathComponent.precomposedStringWithCanonicalMapping == normalized
                  }
              }
          }

          private extension Color {
              static var patchCardBackground: Color { Color(.secondarySystemBackground) }
          }

          private extension PatchProjectStore {
              // Keeps the existing store dependency available to the card without changing its behavior.
          }
          SWIFT

          test -s "$APP_DIR/PreloadedPatches/free_fire_card.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
      - name: Force visible Injector icon
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" "" <<'PY'
          import base64
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          t=p.read_text()
          definition=base64.b64decode(sys.argv[2]).decode()
          if 'private struct InjectorTabIcon: View' not in t:
              t=t.replace('private struct CompactTabLabel: View {', definition+'private struct CompactTabLabel: View {', 1)
          t=t.replace('if let image = UIImage(', 'if title == "Injector" { InjectorTabIcon() } else if let image = UIImage(', 1)
          p.write_text(t)
          PY

      - name: Use orange Injector icon and text colors
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          cp injector_icon_orange.png "$APP_DIR/PreloadedPatches/injector_icon_orange.png"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('.tint(AppTheme.accent)', '.tint(Color.orange)\n        .foregroundStyle(Color.orange)', 1)
          t=t.replace('init() {', 'init() {\n        UITabBar.appearance().tintColor = UIColor.orange\n        UITabBar.appearance().unselectedItemTintColor = UIColor.orange', 1)
          t=t.replace('if let image = UIImage(', 'if title == "Injector", let url = Bundle.main.url(forResource: "injector_icon_orange", withExtension: "png", subdirectory: "PreloadedPatches"), let icon = UIImage(contentsOfFile: url.path) {\n            Image(uiImage: icon).resizable().renderingMode(.original).scaledToFit().frame(width: 24, height: 24)\n        } else if let image = UIImage(', 1)
          p.write_text(t)
          PY

      - name: Apply supplied app background
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          cp 56F68B12-F4DC-4C3A-844E-65ADEE4CEA9E.png "$APP_DIR/PreloadedPatches/app_background.jpg"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          PATCH_SWIFT="$APP_DIR/views/PatchProjectsView.swift"
          python3 - "$CONTENT_SWIFT" "$PATCH_SWIFT" "" <<'PY'
          import base64
          import sys
          from pathlib import Path
          content=Path(sys.argv[1]); patch=Path(sys.argv[2]); t=content.read_text()
          definition=base64.b64decode(sys.argv[3]).decode()
          definition=definition.replace(".opacity(0.58)", ".opacity(1.0)").replace("Color.black.opacity(0.10)", "Color.clear")
          if 'struct AppBackgroundView: View' not in t:
              t=t.replace('private struct CompactTabLabel: View {', definition+'private struct CompactTabLabel: View {', 1)
          t=t.replace('.navigationBarTitleDisplayMode(.inline)\n            .tint(AppTheme.accent)', '.navigationBarTitleDisplayMode(.inline)\n            .scrollContentBackground(.hidden)\n            .background(AppBackgroundView())\n            .tint(AppTheme.accent)', 1)
          content.write_text(t)
          if patch.exists():
              p=patch.read_text()
              p=p.replace('.background(Color(.systemGroupedBackground))', '.background(AppBackgroundView())')
              p=p.replace('.listStyle(.insetGrouped)', '.listStyle(.insetGrouped).scrollContentBackground(.hidden).background(AppBackgroundView())')
              patch.write_text(p)
          PY

      - name: Use native SwiftUI Injector icon
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" "" <<'PY'
          import base64, sys
          from pathlib import Path
          content = Path(sys.argv[1])
          text = content.read_text()
          definition = base64.b64decode(sys.argv[2]).decode()
          start = text.find("private struct CompactTabLabel: View {")
          end = text.find("private extension AppSection", start)
          if start < 0 or end < 0: raise SystemExit("CompactTabLabel boundaries not found")
          content.write_text(text[:start] + definition + "\n\n" + text[end:])
          PY
      - name: Integrar API Kyojinx funcional
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          PBX="$APP_DIR.xcodeproj/project.pbxproj"
          echo "" | base64 --decode > "$APP_DIR/LicenseManager.swift"
          cat >> "$APP_DIR/LicenseManager.swift" <<'SWIFT'

          private enum Branding { static let appName = "Nubank" }
          private extension AppTheme { static var cardBackground: Color { Color(.secondarySystemBackground) } }
          SWIFT
          mkdir -p "$APP_DIR/SDK"
          cp APIClient.h "$APP_DIR/SDK/APIClient.h"
          cp libKyojinxSDK.a "$APP_DIR/SDK/libKyojinxSDK.a"
          BRIDGE="$APP_DIR/ThreeOneOSFive-Bridging-Header.h"
          test -f "$BRIDGE"
          grep -q 'SDK/APIClient.h' "$BRIDGE" || printf '\n#import "SDK/APIClient.h"\n' >> "$BRIDGE"
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          if 'KYOJIN_LICENSE_FILE' not in t:
              t = t.replace('/* Begin PBXBuildFile section */', '/* Begin PBXBuildFile section */\n\t\tKYOJIN_LICENSE_BUILD /* LicenseManager.swift in Sources */ = {isa = PBXBuildFile; fileRef = KYOJIN_LICENSE_FILE; };\n\t\tKYOJIN_SDK_BUILD /* libKyojinxSDK.a in Frameworks */ = {isa = PBXBuildFile; fileRef = KYOJIN_SDK_FILE; };', 1)
              t = t.replace('/* Begin PBXFileReference section */', '/* Begin PBXFileReference section */\n\t\tKYOJIN_LICENSE_FILE /* LicenseManager.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = LicenseManager.swift; sourceTree = "<group>"; };\n\t\tKYOJIN_HEADER_FILE /* APIClient.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = APIClient.h; sourceTree = "<group>"; };\n\t\tKYOJIN_SDK_FILE /* libKyojinxSDK.a */ = {isa = PBXFileReference; explicitFileType = archive.ar; path = libKyojinxSDK.a; sourceTree = "<group>"; };', 1)
              t = t.replace('3105A021 /* ContentView.swift */,', '3105A021 /* ContentView.swift */,\n\t\t\t\tKYOJIN_LICENSE_FILE /* LicenseManager.swift */,\n\t\t\t\tKYOJIN_HEADER_FILE /* APIClient.h */,\n\t\t\t\tKYOJIN_SDK_FILE /* libKyojinxSDK.a */,', 1)
              t = t.replace('/* Begin PBXSourcesBuildPhase section */', '/* Begin PBXSourcesBuildPhase section */', 1)
              t = t.replace('/* Begin PBXFrameworksBuildPhase section */', '/* Begin PBXFrameworksBuildPhase section */', 1)
              t = t.replace('OTHER_LDFLAGS = "-lz";', 'OTHER_LDFLAGS = ("-lz", "-ObjC", "-lc++");')
              src = t.find('isa = PBXSourcesBuildPhase;')
              if src >= 0:
                  fs = t.find('files = (', src)
                  if fs >= 0 and 'KYOJIN_LICENSE_BUILD' not in t[fs:t.find(');', fs)]:
                      t = t[:fs] + t[fs:].replace('files = (', 'files = (\n\t\t\t\tKYOJIN_LICENSE_BUILD /* LicenseManager.swift in Sources */,', 1)
              fw = t.find('isa = PBXFrameworksBuildPhase;')
              if fw >= 0:
                  ff = t.find('files = (', fw)
                  if ff >= 0 and 'KYOJIN_SDK_BUILD' not in t[ff:t.find(');', ff)]:
                      t = t[:ff] + t[ff:].replace('files = (', 'files = (\n\t\t\t\tKYOJIN_SDK_BUILD /* libKyojinxSDK.a in Frameworks */,', 1)
              p.write_text(t)
          PY
          python3 - "$APP_DIR/App.swift" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]); t = p.read_text()
          nl = chr(10)
          # API e tela de licença removidas; o app inicia diretamente.
          p.write_text(t)
          PY
      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive LIBRARY_SEARCH_PATHS="$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
