              sectionContent(.texture)
                  .tabItem { CompactTabLabel(title: "TEXTURA", systemImage: "paintbrush.fill") }
                  .tag(AppSection.texture.rawValue)
          }
          }
          '''
          compact_start = c.find('    private var compactLayout: some View {')
          regular_start = c.find('    private var regularLayout: some View {', compact_start)
          if compact_start >= 0 and regular_start > compact_start:
              c = c[:compact_start] + compact + c[regular_start:]
          else:
