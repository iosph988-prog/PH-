name: 3105 - Nubank Build Without API
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches].filter(isVisible)", 1))
          PY
      - name: Add API login gate
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          python3 - "$APP_SWIFT" "" <<'PY'
          import base64, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text()
          addition = base64.b64decode(sys.argv[2]).decode()
          addition = addition.replace("private static var storedKey", "static var storedKey", 1)
          t = t.replace('import UIKit\n', 'import UIKit\nimport Security\n', 1)
          t = t.replace('    @State private var showOnboarding = false\n', '    @State private var showOnboarding = false\n    @State private var isLicensed = false\n', 1)
          t = t.replace('                    .opacity(showOnboarding ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding)', '                    .opacity(showOnboarding || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && isLicensed)', 1)
          anchor = '                    .zIndex(1)\n                }\n'
          replacement = anchor + '\n                if !showOnboarding && !isLicensed {\n                    LicenseLoginView {\n                        withAnimation(.easeInOut(duration: 0.25)) { isLicensed = true }\n                        appState.detectSupport()\n                        checkForUpdate()\n                    }\n                    .environment(\\.appLanguage, language)\n                    .environment(\\.locale, language.locale)\n                    .zIndex(2)\n                }\n'
          if anchor not in t:
              raise SystemExit('overlay anchor not found')
          t = t.replace(anchor, replacement, 1)
          t = t.replace('            .onAppear {\n                if !showOnboarding {', '            .onAppear {\n                if !showOnboarding && isLicensed {', 1)
          t = t.replace('                guard phase == .active, !showOnboarding else { return }', '                guard phase == .active, !showOnboarding, isLicensed else { return }', 1)
          t += addition
          p.write_text(t)
          PY

      - name: Remove terminal and settings toolbar buttons
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = r"\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showLogs = true \} label: \{\n\s*Image\(systemName: \"apple\.terminal\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_logs\"\)\)\n\s*\}\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showSettings = true \} label: \{\n\s*Image\(systemName: \"gearshape\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_settings\"\)\)\n\s*\}"
          updated, count = re.subn(pattern, "", text, count=1)
          if count == 1:
              p.write_text(updated)
          else:
              print("terminal/settings toolbar block already absent; continuing")
          PY

      - name: Set Início and Injector navigation labels
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('title: language.text(section.titleKey)', 'title: section == .home ? "Início" : "Injector"', 1)
          t=t.replace('systemImage: section.systemImage', 'systemImage: section == .home ? "house.fill" : "gamecontroller.fill"', 1)
          p.write_text(t)
          PY

      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          if text2 == text: raise SystemExit('featuresSection call not found')
          p.write_text(text2)
          PY
      - name: Add preloaded game cards and resources
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          rm -rf "$APP_DIR/PreloadedPatches" "$APP_DIR/PreloadedPatches.pack"
          mkdir -p "$APP_DIR/PreloadedPatches"
          cp 6F54F0A3-A7FC-4AED-8E8E-4234D141B85D.png "$APP_DIR/PreloadedPatches/free_fire_card.png"
          cp BC397CF8-956B-49A7-A6BB-772CEEA5217A.png "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
          cp 'PESÇOCO(3).3105' 'PESCOCO(3).3105'
          for f in 'CABEÇA-ANTENA.3105' 120FPS\(2\).3105 Hologramazul\(2\).3105 Hologramaverde\(4\).3105 HOLOGRAMA3D.3105; do cp "$f" "$APP_DIR/PreloadedPatches/"; done
          mkdir -p /tmp/freefire-skins/dimitri /tmp/freefire-skins/alok
          resolve_mediafire() {
            page="$1"
            output="$2"
            name="$3"
            html=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' "$page")
            url=$(printf '%s' "$html" | grep -oE 'https://download[^" ]+/'"$name"'\.zip' | head -n 1)
            test -n "$url" || { echo "MediaFire download link not found for $name" >&2; exit 1; }
            curl -L --fail --retry 3 -A 'Mozilla/5.0' -o "$output" "$url"
          }
          resolve_mediafire_file() {
            page="$1"
            pattern="$2"
            html=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' "$page")
            url=$(printf '%s' "$html" | grep -oE 'https://download[^" ]+' | grep -m 1 -E "$pattern")
            test -n "$url" || { echo "MediaFire file link not found for $pattern" >&2; exit 1; }
            printf '%s\n' "$url"
          }
          cp 'Hologramavermelho(2).3105' "$APP_DIR/PreloadedPatches/HOLOGRAMA VERMELHO 3D.3105"
          free_fire_card_url=$(resolve_mediafire_file 'https://www.mediafire.com/file/8hej9hlezr3bgjm/IMG_2828.jpeg/file' 'IMG_2828\.jpeg')
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/free_fire_card.jpeg "$free_fire_card_url"
          sips -s format png /tmp/free_fire_card.jpeg --out "$APP_DIR/PreloadedPatches/free_fire_card.png" >/dev/null
          free_fire_max_card_url=$(resolve_mediafire_file 'https://www.mediafire.com/file/7ecmqoxldlbnhm8/IMG_2829.jpeg/file' 'IMG_2829\.jpeg')
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/free_fire_max_card.jpeg "$free_fire_max_card_url"
          sips -s format png /tmp/free_fire_max_card.jpeg --out "$APP_DIR/PreloadedPatches/free_fire_max_card.png" >/dev/null
          resolve_mediafire 'https://www.mediafire.com/file/y96f4eo6jsxxxha/DIMITRI_SKINS.zip/file' /tmp/dimitri.zip DIMITRI_SKINS
          resolve_mediafire 'https://www.mediafire.com/file/10ifzo6sg0ljx06/ALOK_SKINS.zip/file' /tmp/alok.zip ALOK_SKINS
          pastas_page=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' 'https://www.mediafire.com/file/44gyv9vem2ivyve/Pastas_arquivos_.zip/file')
          pastas_url=$(printf '%s' "$pastas_page" | grep -oE 'https://download[^" ]+\.zip' | head -n 1)
          test -n "$pastas_url"
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/pastas_arquivos.zip "$pastas_url"
          unzip -q /tmp/pastas_arquivos.zip -d /tmp/pastas-arquivos
          while IFS= read -r src; do cp "$src" "$APP_DIR/PreloadedPatches/$(basename "$src")"; done < <(find /tmp/pastas-arquivos -type f -name '*.3105' ! -path '*/__MACOSX/*' ! -name '._*' | sort)
          unzip -q /tmp/dimitri.zip -d /tmp/freefire-skins/dimitri
          unzip -q /tmp/alok.zip -d /tmp/freefire-skins/alok
          i=1
          while IFS= read -r src; do
            cp "$src" "$APP_DIR/PreloadedPatches/dimitri_skin_$(printf '%02d' "$i").3105"
            i=$((i + 1))
          done < <(find /tmp/freefire-skins/dimitri -type f -name '*.3105' ! -path '*/__MACOSX/*' ! -name '._*' | sort)
          i=1
          while IFS= read -r src; do
            cp "$src" "$APP_DIR/PreloadedPatches/alok_skin_$(printf '%02d' "$i").3105"
            i=$((i + 1))
          done < <(find /tmp/freefire-skins/alok -type f -name '*.3105' ! -path '*/__MACOSX/*' ! -name '._*' | sort)
          test "$(find "$APP_DIR/PreloadedPatches" -name 'dimitri_skin_*.3105' | wc -l | tr -d ' ')" = 8
          test "$(find "$APP_DIR/PreloadedPatches" -name 'alok_skin_*.3105' | wc -l | tr -d ' ')" = 8
          dimitri_portrait=$(find /tmp/freefire-skins/dimitri -type f \( -iname '*logo*' -o -iname '*portrait*' -o -iname '*.png' \) ! -path '*/__MACOSX/*' ! -name '._*' | sort | head -n 1)
          alok_portrait=$(find /tmp/freefire-skins/alok -type f \( -iname '*logo*' -o -iname '*portrait*' -o -iname '*.png' \) ! -path '*/__MACOSX/*' ! -name '._*' | sort | head -n 1)
          test -n "$dimitri_portrait" && test -n "$alok_portrait"
          cp "$dimitri_portrait" "$APP_DIR/PreloadedPatches/dimitri_logo.png"
          cp "$alok_portrait" "$APP_DIR/PreloadedPatches/alok_logo.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_card.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
          test -s "$APP_DIR/PreloadedPatches/dimitri_logo.png"
          test -s "$APP_DIR/PreloadedPatches/alok_logo.png"
          for group in dimitri alok; do
            for n in $(seq 1 8); do
              nn=$(printf '%02d' "$n")
              photo=$(find "/tmp/freefire-skins/$group" -type f -path "*/Skin_${nn}/*" -iname '*.png' ! -path '*/__MACOSX/*' ! -name '._*' | sort | head -n 1)
              test -n "$photo"
              cp "$photo" "$APP_DIR/PreloadedPatches/${group}_skin_${nn}.png"
            done
          done
          PACK="$APP_DIR/PreloadedPatches.pack"
          : > "$PACK"
          while IFS= read -r -d '' asset; do
            rel="${asset#"$APP_DIR/PreloadedPatches/"}"
            printf '%s\t' "$rel" >> "$PACK"
            base64 < "$asset" | tr -d '\n' >> "$PACK"
            printf '\n' >> "$PACK"
          done < <(find "$APP_DIR/PreloadedPatches" -type f ! -name '._*' -print0 | sort -z)
          rm -rf "$APP_DIR/PreloadedPatches"
          # O pack será anexado ao executável 3105 após o archive; não o registre como recurso do bundle.
          cat > source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import CryptoKit

          private enum EmbeddedPatchStore {
              private static let folderName = ".preloaded_runtime"
              private static var preparedURL: URL?
              private static let lock = NSLock()

              static func prepare() -> URL? {
                  lock.lock(); defer { lock.unlock() }
                  if let preparedURL { return preparedURL }
                  guard let executableURL = Bundle.main.executableURL,
                        let executableData = try? Data(contentsOf: executableURL),
                        let marker = "PH_PRELOADED_PACK_V1\n".data(using: .utf8),
                        let markerRange = executableData.range(of: marker) else { return nil }
                  let payload = executableData[markerRange.upperBound...]
                  guard let text = String(data: payload, encoding: .utf8) else { return nil }
                  let root = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask)[0].appendingPathComponent(folderName, isDirectory: true)
                  try? FileManager.default.removeItem(at: root)
                  try? FileManager.default.createDirectory(at: root, withIntermediateDirectories: true)
                  for line in text.split(whereSeparator: \.isNewline) {
                      let parts = line.split(separator: "\t", maxSplits: 1).map(String.init)
                      guard parts.count == 2, let data = Data(base64Encoded: parts[1]) else { continue }
                      let destination = root.appendingPathComponent(parts[0])
                      try? data.write(to: destination, options: .atomic)
                  }
                  preparedURL = root
                  return root
              }

              static func url(for fileName: String) -> URL? {
                  prepare()?.appendingPathComponent(fileName)
              }

              static func image(for fileName: String) -> UIImage? {
                  guard let fileURL = url(for: fileName), let data = try? Data(contentsOf: fileURL) else { return nil }
                  return UIImage(data: data)
              }

              static func allPatchURLs() -> [URL] {
                  guard let root = prepare(), let items = try? FileManager.default.contentsOfDirectory(at: root, includingPropertiesForKeys: nil) else { return [] }
                  return items
              }
          }

          private struct PreloadedGame: Identifiable {
              let id: String
              let title: String
              let bundleID: String
              let patches: [PreloadedPatch]
          }

          private struct PreloadedPatch: Identifiable, Hashable {
              let id: String
              let title: String
              let fileName: String
              let replacementCount: Int
              let imageName: String?
              let logoName: String?

              init(id: String, title: String, fileName: String, replacementCount: Int, imageName: String? = nil, logoName: String? = nil) {
                  self.id = id
                  self.title = title
                  self.fileName = fileName
                  self.replacementCount = replacementCount
                  self.imageName = imageName
                  self.logoName = logoName
              }
          }

          private let preloadedGames: [PreloadedGame] = [
              PreloadedGame(
                  id: "free-fire",
                  title: "Free Fire",
                  bundleID: "com.dts.freefireth",
                  patches: [
                      PreloadedPatch(id: "free-pastas-pescoco-melhorado", title: "HS PESCOÇO MELHORADO", fileName: "HS PESCOÇO MELHORADO.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-barriga-antena", title: "HS BARRIGA - ANTENA", fileName: "HS BARRIGA - ANTENA.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-peito-bruto", title: "HS PEITO BRUTO", fileName: "HS PEITO BRUTO.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-peito-lite-antena", title: "HS PEITO LITE - ANTENA", fileName: "HS PEITO LITE - ANTENA.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-peito-bruto-antena", title: "HS PEITO BRUTO - ANTENA", fileName: "HS PEITO BRUTO - ANTENA.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-bala-magica-antena", title: "BALA MAGICA - ANTENA", fileName: "BALA MAGICA - ANTENA.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-peito-lite", title: "HS PEITO LITE", fileName: "HS PEITO LITE.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-alto", title: "HS ALTO", fileName: "HS ALTO.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-alto-pescoco", title: "HS ALTO + PESCOÇO", fileName: "HS ALTO + PESCOÇO .3105", replacementCount: 1),
                      PreloadedPatch(id: "free-pastas-pescoco-antena", title: "HS PESCOÇO - ANTENA", fileName: "HS PESCOÇO - ANTENA.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-120fps", title: "120FPS", fileName: "120FPS(2).3105", replacementCount: 1),
                      PreloadedPatch(id: "free-holograma-3d", title: "HOLOGRAMA 3D", fileName: "HOLOGRAMA3D.3105", replacementCount: 1),
                      PreloadedPatch(id: "free-holograma-vermelho-3d", title: "HOLOGRAMA VERMELHO 3D", fileName: "HOLOGRAMA VERMELHO 3D.3105", replacementCount: 1)
                  ]
              ),
              PreloadedGame(
                  id: "free-fire-max",
                  title: "Free Fire MAX",
                  bundleID: "com.dts.freefiremax",
                  patches: [
                      PreloadedPatch(id: "max-verde", title: "Holograma verde", fileName: "Hologramaverde(4).3105", replacementCount: 1),
                      PreloadedPatch(id: "max-azul", title: "Holograma azul", fileName: "Hologramazul(2).3105", replacementCount: 1),
                  ]
              ),
              PreloadedGame(
                  id: "free-fire-skins",
                  title: "Free Fire skins",
                  bundleID: "com.dts.freefireth",
                  patches: [
                      PreloadedPatch(id: "dimitri-skin-01", title: "Dimitri — Skin 01", fileName: "dimitri_skin_01.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-02", title: "Dimitri — Skin 02", fileName: "dimitri_skin_02.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-03", title: "Dimitri — Skin 03", fileName: "dimitri_skin_03.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-04", title: "Dimitri — Skin 04", fileName: "dimitri_skin_04.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-05", title: "Dimitri — Skin 05", fileName: "dimitri_skin_05.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-06", title: "Dimitri — Skin 06", fileName: "dimitri_skin_06.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-07", title: "Dimitri — Skin 07", fileName: "dimitri_skin_07.3105", replacementCount: 1),
                      PreloadedPatch(id: "dimitri-skin-08", title: "Dimitri — Skin 08", fileName: "dimitri_skin_08.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-01", title: "Alok — Skin 01", fileName: "alok_skin_01.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-02", title: "Alok — Skin 02", fileName: "alok_skin_02.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-03", title: "Alok — Skin 03", fileName: "alok_skin_03.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-04", title: "Alok — Skin 04", fileName: "alok_skin_04.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-05", title: "Alok — Skin 05", fileName: "alok_skin_05.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-06", title: "Alok — Skin 06", fileName: "alok_skin_06.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-07", title: "Alok — Skin 07", fileName: "alok_skin_07.3105", replacementCount: 1),
                      PreloadedPatch(id: "alok-skin-08", title: "Alok — Skin 08", fileName: "alok_skin_08.3105", replacementCount: 1)
                  ]
              )
          ]

          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore()
              @State private var selectedGameID = "free-fire"
              @AppStorage("patchTheme") private var themeChoice = "dark"

                            private var selectedGame: PreloadedGame {
                  preloadedGames.first(where: { $0.id == selectedGameID }) ?? preloadedGames[0]
              }
              private var displayedPatches: [PreloadedPatch] {
                  if selectedGameID == "free-fire-max" {
                      return selectedGame.patches
                  }
                  return selectedGame.patches
              }
              private var aimbotPatches: [PreloadedPatch] {
                  displayedPatches.filter { patch in
                      let title = patch.title.uppercased()
                      return !title.contains("HOLOGRAMA")
                  }
              }
              private var hologramPatches: [PreloadedPatch] {
                  displayedPatches.filter { patch in
                      let title = patch.title.uppercased()
                      return title.contains("HOLOGRAMA")
                  }
              }
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 22) {
                              Text("SELECIONE O JOGO")
                                  .font(.system(size: 17, weight: .heavy, design: .rounded))
                                  .tracking(0.8)
                                  .foregroundStyle(Color.patchPrimaryText)
                                  .frame(maxWidth: .infinity, alignment: .leading)
                              HStack(spacing: 10) {
                                  ForEach(preloadedGames.prefix(2)) { game in
                                      GameSelectionCard(game: game, selected: selectedGameID == game.id) {
                                          withAnimation(.easeInOut(duration: 0.2)) { selectedGameID = game.id }
                                      }
                                  }
                              }
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 2)

                              VStack(spacing: 18) {
                                  PatchCategorySection(title: "FUNÇÕES DE AIMBOT", subtitle: "Recursos de precisão e desempenho", patches: aimbotPatches, store: store)
                                  if !hologramPatches.isEmpty {
                                      PatchCategorySection(title: "FUNÇÕES DE HOLOGRAMA", subtitle: "Efeitos visuais para o jogo", patches: hologramPatches, store: store)
                                  }
                                  if selectedGameID == "free-fire" {
                                      FreeFireSkinsCard(store: store)
                                  }
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 20)
                          .padding(.bottom, 28)
                      }
                      .background(Color.patchScreenBackground.ignoresSafeArea())
                      .scrollContentBackground(.hidden)
                      .navigationTitle("FUNÇÕES EXTERNAL")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Menu {
                                  Button { themeChoice = "dark" } label: {
                                      Label("Tema preto", systemImage: "moon.fill")
                                  }
                                  Button { themeChoice = "light" } label: {
                                      Label("Tema branco", systemImage: "sun.max.fill")
                                  }
                              } label: {
                                  Image(systemName: themeChoice == "dark" ? "moon.fill" : "sun.max.fill")
                              }
                              .accessibilityLabel("Escolher tema")
                          }
                      }
                      .preferredColorScheme(themeChoice == "light" ? .light : .dark)
                  }
              }
          }

          private struct PatchCategorySection: View {
              let title: String
              let subtitle: String
              let patches: [PreloadedPatch]
              @ObservedObject var store: PatchProjectStore
              var body: some View {
                  VStack(alignment: .leading, spacing: 9) {
                      Text(title)
                          .font(.system(size: 17, weight: .heavy, design: .rounded))
                          .tracking(0.4)
                          .foregroundStyle(Color.patchPrimaryText)
                      Text(subtitle)
                          .font(.system(size: 12, weight: .semibold, design: .rounded))
                          .foregroundStyle(Color.patchSecondaryText)
                          .padding(.bottom, 2)
                      VStack(spacing: 0) {
                          ForEach(patches) { patch in
                              PreloadedPatchCard(patch: patch, store: store)
