          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          content = Path(sys.argv[1])
          text = content.read_text()
          text = text.replace('Patches para External injector', 'Injector')
          text = text.replace('rocket.fill', 'gamecontroller.fill')
          text = text.replace('shippingbox.fill', 'gamecontroller.fill')
          text = text.replace('syringe.fill', 'gamecontroller.fill')
          content.write_text(text)
          for path in Path('source').rglob('PatchProjectsView.swift'):
              lines = path.read_text().splitlines(keepends=True)
              filtered = []
              for line in lines:
                  old = any(token in line for token in (
                      'max-peito-antena', 'max-magic', 'max-pescoco",',
                      'Pescoço + antena avatar', 'Magic avatar', 'Pescoço avatar',
                      'Magicavatar(2).3105', 'Pescoço+antenaavatar(2).3105',
                  ))
                  if not old:
                      filtered.append(line)
              path.write_text(''.join(filtered))
          PY
          ! grep -R -nE 'Pescoço \+ antena avatar|Magic avatar|Pescoço avatar|Magicavatar\(2\)\.3105|Pescoço\+antenaavatar\(2\)\.3105' source --include='PatchProjectsView.swift'
          grep -R -n 'Injector' source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          grep -R -n 'gamecontroller.fill' source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
      - name: Replace Free Fire card assets
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.mediafire.com/file/3f421syteuwt314/Ff+Th+.zip/file'
          html=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' "$page")
          url=$(printf '%s' "$html" | grep -oE 'https://download[^" ]+\.zip' | head -n 1)
          test -n "$url"
          rm -rf replacement-assets
          mkdir -p replacement-assets
          curl -LfsS --retry 3 -A 'Mozilla/5.0' "$url" -o replacement-assets/free-fire-assets.zip
          unzip -q replacement-assets/free-fire-assets.zip -d replacement-assets/unpacked
          find replacement-assets/unpacked -type f ! -path '*/__MACOSX/*' -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              *'PESCOC'*'80'*'CACHE'*) cp "$file" 'PESCOÇO 80- -CACHE-.3105' ;;
              *'PESCOC'*'CACHE'*) cp "$file" 'PESCOÇO -CACHE-.3105' ;;
              *'PEITO'*'CACHE'*) cp "$file" 'PEITO -CACHE-.3105' ;;
              *'Holograma verde'*) cp "$file" 'Holograma verde .3105' ;;
            esac
          done
          test -s 'PESCOÇO -CACHE-.3105'
          test -s 'PESCOÇO 80- -CACHE-.3105'
          test -s 'PEITO -CACHE-.3105'
          test -s 'Holograma verde .3105'
          mv 'PESCOÇO -CACHE-.3105' 'HS BARRIGA - ANTENA.3105'
          mv 'PESCOÇO 80- -CACHE-.3105' 'HS PEITO BRUTO.3105'
          mv 'PEITO -CACHE-.3105' 'HOLOGRAMA3D.3105'
          mv 'Holograma verde .3105' 'HOLOGRAMA VERMELHO 3D.3105'

      - name: Update Free Fire card entries
        shell: bash
        run: |
          set -euo pipefail
          echo "Free Fire entries are managed by the V1 asset step"

      - name: Replace green hologram and add V1 Free Fire assets
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.mediafire.com/file/8mkjkusmqkxpf8o/V1+ARQUIVOS.zip/file'
          html=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' "$page")
          url=$(printf '%s' "$html" | grep -oE 'https://download[^" ]+\.zip' | head -n 1)
          test -n "$url"
          rm -rf v1-assets
          mkdir -p v1-assets/unpacked
          curl -LfsS --retry 3 -A 'Mozilla/5.0' "$url" -o v1-assets/V1-ARQUIVOS.zip
          unzip -q v1-assets/V1-ARQUIVOS.zip -d v1-assets/unpacked
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          find v1-assets/unpacked -type f -name '*.3105' ! -path '*/__MACOSX/*' ! -name '._*' -exec cp {} "$APP_DIR/PreloadedPatches/" \;
          PATCH_FILE=$(find source -type f -name 'PatchProjectsView.swift' -print -quit)
          test -f "$PATCH_FILE"
          python3 - "$PATCH_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'\s*PreloadedPatch\([^)]*title: "HOLOGRAMA 3D"[^)]*\),?', '', text, count=1)
          text = re.sub(r'\s*PreloadedPatch\([^)]*title: "HOLOGRAMA VERMELHO 3D"[^)]*\),?', '', text, count=1)
          text = re.sub(r'\s*PreloadedPatch\([^)]*title: "HOLOGRAMA"[^)]*\),?', '', text, count=1)
          text = re.sub(r'\s*PreloadedPatch\(id: "free-new-holograma-verde"[^)]*\),?', '', text, count=1)
          entries = (
              'PreloadedPatch(id: "free-v1-pescoco-lite-antena", title: "HS PESCOÇO LITE - ANTENA", fileName: "HS PESCOÇO LITE - ANTENA.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-v1-peito-cabeca-bugada", title: "HS PEITO CABEÇA BUGADA", fileName: "HS PEITO CABECA BUGADA.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-v1-cabecao-antena-avatar", title: "HS CABEÇÃO - ANTENA AVATAR", fileName: "HS CABEÇÃO - ANTENA AVATAR.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-v1-ibigo-antena-avatar", title: "HS IBIGO - ANTENA AVATAR", fileName: "HS IBIGO- ANTENA AVATAR.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-v1-holograma-verde", title: "HOLOGRAMA - VERDE", fileName: "HOLOGRAMA - VERDE .3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-v1-barriga-v2", title: "HS BARRIGA V2", fileName: "HS BARRIGA V2.3105", replacementCount: 1)'
          )
          anchor = re.compile(r'(\]\s*\),\s*PreloadedGame\(\s*id: "free-fire-max")')
          updated, count = anchor.subn(', ' + ''.join(entries) + r' \1', text, count=1)
          if count != 1:
              raise SystemExit('Free Fire card anchor not found')
          path.write_text(updated)
          PY

      - name: Add Arquivo cache assets to Free Fire card
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.mediafire.com/file/7stga484wq8w1yf/Arquivo.zip/file'
          html=$(curl -LfsS --retry 3 -A 'Mozilla/5.0' "$page")
          url=$(printf '%s' "$html" | grep -oE 'https://download[^" ]+\.zip' | head -n 1)
          test -n "$url"
          rm -rf arquivo-assets
          mkdir -p arquivo-assets/unpacked
          curl -LfsS --retry 3 -A 'Mozilla/5.0' "$url" -o arquivo-assets/Arquivo.zip
          unzip -q arquivo-assets/Arquivo.zip -d arquivo-assets/unpacked
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          PATCH_DIR="$APP_DIR/PreloadedPatches"
          mkdir -p "$PATCH_DIR"
          find arquivo-assets/unpacked -type f -name '*.3105' ! -path '*/__MACOSX/*' ! -name '.*' -exec cp {} "$PATCH_DIR/" \;
          PATCH_FILE=$(find source -type f -name 'PatchProjectsView.swift' -print -quit)
          test -f "$PATCH_FILE"
          python3 - "$PATCH_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          ids = ['free-arquivo-peito-cache', 'free-arquivo-pescoco-cache', 'free-arquivo-alto-cache', 'free-arquivo-pescoco-80-cache']
          for patch_id in ids:
              text = re.sub(r'\s*PreloadedPatch\([^)]*id: "' + re.escape(patch_id) + r'"[^)]*\),?', '', text, count=1)
          entries = (
              'PreloadedPatch(id: "free-arquivo-peito-cache", title: "HS PEITO - CACHE", fileName: "HS  PEITO -CACHE-.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-arquivo-pescoco-cache", title: "HS PESCOÇO - CACHE", fileName: "HS  PESCOÇO -CACHE-.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-arquivo-alto-cache", title: "HS ALTO CACHE", fileName: "HS ALTO CACHE.3105", replacementCount: 1), ',
              'PreloadedPatch(id: "free-arquivo-pescoco-80-cache", title: "HS PESCOÇO 80 - CACHE", fileName: "HS PESCOÇO 80- -CACHE-.3105", replacementCount: 1)'
          )
          anchor = re.compile(r'(\]\s*\),\s*PreloadedGame\(\s*id: "free-fire-max")')
          updated, count = anchor.subn(', ' + ''.join(entries) + r' \1', text, count=1)
          if count != 1:
              raise SystemExit('Free Fire card anchor not found')
          updated = re.sub(r',\s*,', ',', updated)
          path.write_text(updated)
          PY
      
      - name: Repack Free Fire card assets after all additions
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          PATCH_DIR="$APP_DIR/PreloadedPatches"
          PACK="$APP_DIR/PreloadedPatches.pack"
          test -d "$PATCH_DIR"
          : > "$PACK"
          while IFS= read -r -d '' asset; do
            rel="${asset#"$APP_DIR/PreloadedPatches/"}"
            printf '%s\t' "$rel" >> "$PACK"
            base64 < "$asset" | tr -d '\n' >> "$PACK"
            printf '\n' >> "$PACK"
          done < <(find "$PATCH_DIR" -type f ! -name '._*' -print0 | sort -z)
          test -s "$PACK"
          for required in 'HS  PEITO -CACHE-.3105' 'HS  PESCOÇO -CACHE-.3105' 'HS ALTO CACHE.3105' 'HS PESCOÇO 80- -CACHE-.3105'; do
            grep -Fq "$required" "$PACK"
          done
      - name: Finalize compact game catalogs and exact logos
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          mkdir -p "$APP_DIR/views" "$APP_DIR/PreloadedPatches"
          printf '%s' '' | base64 --decode > /tmp/free_fire_card.jpg
          printf '%s' '' | base64 --decode > /tmp/free_fire_max_card.jpg
          sips -s format png /tmp/free_fire_card.jpg --out "$APP_DIR/PreloadedPatches/free_fire_card.png" >/dev/null
          sips -s format png /tmp/free_fire_max_card.jpg --out "$APP_DIR/PreloadedPatches/free_fire_max_card.png" >/dev/null
          printf '%s' '' | base64 --decode > "$APP_DIR/views/PatchProjectsView.swift"
          test -s "$APP_DIR/views/PatchProjectsView.swift"
          test -s "$APP_DIR/PreloadedPatches/free_fire_card.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive LIBRARY_SEARCH_PATHS="$PWD/source/3105-1.1.1/ThreeOneOSFive/SDK" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
