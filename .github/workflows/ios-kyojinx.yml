              static func fetchCatalog(section: String? = nil) async -> [RemotePatchDescriptor]? {
                  guard let key = LicenseStore.storedKey else { return nil }
                  do {
                      var request = URLRequest(url: catalogURL, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      var payload: [String: Any] = ["key": key.trimmingCharacters(in: .whitespacesAndNewlines).uppercased(), "device_id": UIDevice.current.identifierForVendor?.uuidString ?? "unknown-device", "package": Bundle.main.bundleIdentifier ?? "unknown.bundle", "app_version": Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0", "catalog": "online"]
                      if let section { payload["section"] = section }
                      request.httpBody = try JSONSerialization.data(withJSONObject: payload)
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid else { return nil }
                      return catalog.patches
                  } catch { return nil }
              }
              static func resolve(patch: PreloadedPatch) async -> URL? {
                  guard let key = LicenseStore.storedKey else { return cachedFile(named: patch.fileName) }
                  do {
                      var request = URLRequest(url: catalogURL, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      request.httpBody = try JSONSerialization.data(withJSONObject: ["key": key.trimmingCharacters(in: .whitespacesAndNewlines).uppercased(), "device_id": UIDevice.current.identifierForVendor?.uuidString ?? "unknown-device", "package": Bundle.main.bundleIdentifier ?? "unknown.bundle", "app_version": Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0", "section": "patches"])
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode), let catalog = try? JSONDecoder().decode(RemotePatchCatalogResponse.self, from: data), catalog.valid, let descriptor = catalog.patches?.first(where: { $0.section == "patches" && $0.fileName.precomposedStringWithCanonicalMapping == patch.fileName.precomposedStringWithCanonicalMapping }), let url = URL(string: descriptor.downloadUrl) else { return cachedFile(named: patch.fileName) }
                      let (fileData, fileResponse) = try await URLSession.shared.data(from: url)
                      guard let fileHTTP = fileResponse as? HTTPURLResponse, (200..<300).contains(fileHTTP.statusCode), fileData.count == descriptor.sizeBytes else { return cachedFile(named: patch.fileName) }
                      let digest = SHA256.hash(data: fileData).map { String(format: "%02x", $0) }.joined()
                      guard digest.caseInsensitiveCompare(descriptor.sha256) == .orderedSame else { return cachedFile(named: patch.fileName) }
                      let dir = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("RemotePatches", isDirectory: true)
                      try FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                      let destination = dir.appendingPathComponent(patch.fileName)
                      try fileData.write(to: destination, options: .atomic)
                      return destination
                  } catch { return cachedFile(named: patch.fileName) }
              }
          }
