name: 3105 - Nubank Build Without API
on: [push, workflow_dispatch]
jobs: 
  build: 
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Hide legacy URLs from executable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/3105-1.1.1/ThreeOneOSFive")
          app = root / "App.swift"
          app_text = app.read_text()
          helper = """\n\n@inline(never)\nfunc PHDecodeLegacyURL(_ payload: [UInt8]) -> String {\n    let salt = Bundle.main.bundleIdentifier?.utf8.first ?? 0\n    return String(decoding: payload.map { $0 ^ 0x5A ^ salt }, as: UTF8.self)\n}\n"""
          if "func PHDecodeLegacyURL" not in app_text:
              app.write_text(app_text + helper)
          pattern = re.compile(r'"(https?://[^"\\\n]+)"')
          bundle_salt = ord("c")
          raw_domain = "raw.githubusercontent.com"
          raw_encoded = ", ".join(str(b ^ 0x5A ^ bundle_salt) for b in raw_domain.encode("utf-8"))
          for path in root.rglob("*.swift"):
              text = path.read_text()
              def encode(match):
                  value = match.group(1)
                  values = ", ".join(str(b ^ 0x5A ^ bundle_salt) for b in value.encode("utf-8"))
                  return f'PHDecodeLegacyURL([{values}])'
              updated = pattern.sub(encode, text)
              updated = updated.replace('"raw.githubusercontent.com"', f'PHDecodeLegacyURL([{raw_encoded}])')
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches, .external].filter(isVisible)", 1))
          PY
      - name: Add API login gate
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          python3 - "$APP_SWIFT" "" <<'PY'
          import base64, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          t = p.read_text()
          addition = base64.b64decode(sys.argv[2]).decode()
          addition = addition.replace("private static var storedKey", "static var storedKey", 1)
          t = t.replace('import UIKit\n', 'import UIKit\nimport Security\n', 1)
          t = t.replace('    @State private var showOnboarding = false\n', '    @State private var showOnboarding = false\n    @State private var isLicensed = false\n', 1)
          t = t.replace('                    .opacity(showOnboarding ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding)', '                    .opacity(showOnboarding || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && isLicensed)', 1)
          anchor = '                    .zIndex(1)\n                }\n'
          replacement = anchor + '\n                if !showOnboarding && !isLicensed {\n                    LicenseLoginView {\n                        withAnimation(.easeInOut(duration: 0.25)) { isLicensed = true }\n                        appState.detectSupport()\n                        checkForUpdate()\n                    }\n                    .environment(\\.appLanguage, language)\n                    .environment(\\.locale, language.locale)\n                    .zIndex(2)\n                }\n'
          if anchor not in t:
              raise SystemExit('overlay anchor not found')
          t = t.replace(anchor, replacement, 1)
          t = t.replace('            .onAppear {\n                if !showOnboarding {', '            .onAppear {\n                if !showOnboarding && isLicensed {', 1)
          t = t.replace('                guard phase == .active, !showOnboarding else { return }', '                guard phase == .active, !showOnboarding, isLicensed else { return }', 1)
          t += addition
          p.write_text(t)
          PY

      - name: Add calculator unlock screen before API
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          curl -fsSL https://files.manuscdn.com/user_upload_by_module/session_file/310519663912938762/PqdDhCNKFTkScSzG.swift -o /tmp/CalculatorGateView.swift
          python3 - "$APP_SWIFT" /tmp/CalculatorGateView.swift <<'PY'
          from pathlib import Path
          import sys
          app = Path(sys.argv[1])
          component = Path(sys.argv[2]).read_text()
          t = app.read_text()
          if 'private var calculatorUnlocked = false' not in t:
              t = t.replace('    @State private var isLicensed = false\n', '    @State private var isLicensed = false\n    @State private var calculatorUnlocked = false\n', 1)
          t = t.replace('.opacity(showOnboarding || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && isLicensed)', '.opacity(showOnboarding || !calculatorUnlocked || !isLicensed ? 0 : 1)\n                    .allowsHitTesting(!showOnboarding && calculatorUnlocked && isLicensed)', 1)
          gate = '''                if !showOnboarding && !calculatorUnlocked {
                    CalculatorGateView {
                        withAnimation(.easeInOut(duration: 0.25)) { calculatorUnlocked = true }
                    }
                    .ignoresSafeArea()
                    .zIndex(3)
                }

          '''
          marker = '                if !showOnboarding && !isLicensed {'
          if 'CalculatorGateView {' not in t and marker in t:
              t = t.replace(marker, gate + marker, 1)
          if 'private struct CalculatorGateView' not in t:
              t += '\n' + component
          app.write_text(t)
          PY

      - name: Remove terminal and settings toolbar buttons
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          pattern = r"\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showLogs = true \} label: \{\n\s*Image\(systemName: \"apple\.terminal\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_logs\"\)\)\n\s*\}\n\s*ToolbarItem\(placement: \.navigationBarTrailing\) \{\n\s*Button \{ showSettings = true \} label: \{\n\s*Image\(systemName: \"gearshape\"\)\n\s*\}\n\s*\.accessibilityLabel\(language\.text\(\"accessibility\.open_settings\"\)\)\n\s*\}"
          updated, count = re.subn(pattern, "", text, count=1)
          p.write_text(updated if count == 1 else text)
          print(f"removed legacy toolbar block: {count}")
          PY

      - name: Replace GitHub update checker with Railway announcement
        shell: bash
        run: |
          set -euo pipefail
          UTILS_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/Utils.swift
          python3 - <<"PY" "$UTILS_SWIFT"
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()
          replacement = r"""enum AppUpdateChecker {
              static let dismissedVersionKey = "update.dismissedVersion"
              struct Offer: Identifiable { let id = UUID(); let version: String; let url: URL }
              static let apiURL = URL(string: String(data: Data(base64Encoded: "aHR0cHM6Ly9hcGktcHJvZHVjdGlvbi0xODJjLnVwLnJhaWx3YXkuYXBwL2FwaS9hbm5vdW5jZW1lbnQ=")!, encoding: .utf8)!)!
              static func dismiss(version: String) { UserDefaults.standard.set(version, forKey: dismissedVersionKey) }
              static func check() async -> Offer? {
                  do {
                      let (data, response) = try await URLSession.shared.data(from: apiURL)
                      guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else { return nil }
                      let a = try JSONDecoder().decode(Announcement.self, from: data)
                      guard a.enabled, let url = URL(string: a.url), UserDefaults.standard.string(forKey: dismissedVersionKey) != a.version else { return nil }
                      return Offer(version: a.version, url: url)
                  } catch { return nil }
              }
              private struct Announcement: Decodable { let enabled: Bool; let version: String; let url: String }
          }"""
          updated, count = re.subn(r"enum AppUpdateChecker \{.*\Z", replacement, t, count=1, flags=re.S)
          if count != 1: raise SystemExit("AppUpdateChecker enum not found")
          p.write_text(updated)
          PY
      - name: Set Início and Injector navigation labels
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text()
          t=t.replace('title: language.text(section.titleKey)', 'title: section == .home ? "Início" : (section == .external ? "External" : "PROXY")', 1)
          t=t.replace('systemImage: section.systemImage', 'systemImage: section == .home ? "house.fill" : (section == .patches ? "scope" : "gamecontroller.fill")', 1)
          p.write_text(t)
          PY

      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          p.write_text(text2)
          print(f'removed legacy features section call: {text2 != text}')
          PY
      - name: Add External external panel tab
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          NAV_SWIFT="$APP_DIR/helpers/AppTabNavigationState.swift"
          CONTENT_SWIFT="$APP_DIR/ContentView.swift"
          python3 - "$NAV_SWIFT" "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          nav, content = map(Path, sys.argv[1:])
          n = nav.read_text()
          if "    case patches\n" not in n:
              n = n.replace("    case installed\n", "    case patches\n    case external\n", 1)
          else:
              n = n.replace("    case patches\n", "    case patches\n    case external\n", 1)
          n = n.replace("case .home, .files, .patches:", "case .home, .files, .patches, .external:", 1)
          nav.write_text(n)
          c = content.read_text()
          c = c.replace("AppSection.installed", "AppSection.patches")
          c = c.replace("case .installed:", "case .patches:", 1)
          c = c.replace("case .patches:\n            PatchProjectsView(\n                onOpenSettings: openSettings,\n                onOpenLogs: openLogs\n            )", "case .patches:\n            PatchProjectsView()", 1)
          c = c.replace("        case .patches:\n            PatchProjectsView()", "        case .patches:\n            PatchProjectsView()\n        case .external:\n            ExternalPanelView()", 1)
          c = c.replace("        case .installed: return \"tab.installed\"", "        case .patches: return \"Online\"\n        case .external: return \"External\"", 1)
          c = c.replace("        case .installed: return \"tray.full.fill\"", "        case .patches: return \"scope\"\n        case .external: return \"gamecontroller.fill\"", 1)
          c = c.replace("        .patchStorePresentation(patchStore)\n", "", 1)
          content.write_text(c)
          PY

      - name: Add game card images only (online patches)
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          # Logos and .3105 patches are loaded from Railway at runtime; nothing is copied into the app bundle.
          cat > source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import CryptoKit
          
          private struct PreloadedGame: Identifiable {
              let id: String
              let title: String
              let bundleID: String
              let patches: [PreloadedPatch]
          }
          
          private struct PreloadedPatch: Identifiable, Hashable {
              let id: String
              let title: String
              let fileName: String
              let replacementCount: Int
          }
          
          private let patchCatalog: [PreloadedPatch] = []
          
          private let freeFirePatchCatalog: [PreloadedPatch] = [
              PreloadedPatch(id: "free-fire-0", title: "BALA MAGICA - ANTENA", fileName: "BALA MAGICA - ANTENA.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-1", title: "HS ALTO + PESCOCÇO", fileName: "HS ALTO + PESCOÇO .3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-2", title: "HS ALTO", fileName: "HS ALTO.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-3", title: "HS BARRIGA V2", fileName: "HS BARRIGA V2.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-4", title: "HS CABECÇAO - ANTENA AVATAR", fileName: "HS CABEÇAO - ANTENA AVATAR.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-5", title: "HS IBIGO- ANTENA AVATAR", fileName: "HS IBIGO- ANTENA AVATAR.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-6", title: "HS PEITO CABECA BUGADA", fileName: "HS PEITO CABECA BUGADA.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-7", title: "HS PEITO LITE - ANTENA", fileName: "HS PEITO LITE - ANTENA.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-8", title: "HS PESCOCÇO  LITE - ANTENA", fileName: "HS PESCOÇO  LITE - ANTENA.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-9", title: "HS PESCOCÇO - ANTENA", fileName: "HS PESCOÇO - ANTENA.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-10", title: "HS PESCOCÇO MELHORADO", fileName: "HS PESCOÇO MELHORADO.3105", replacementCount: 1),
              PreloadedPatch(id: "free-fire-11", title: "Holograma verde", fileName: "Holograma verde .3105", replacementCount: 1),
          ]

          private let preloadedGames: [PreloadedGame] = [
              PreloadedGame(id: "free-fire", title: "FREE FIRE", bundleID: "com.dts.freefireth", patches: freeFirePatchCatalog),
              PreloadedGame(id: "free-fire-max", title: "FREE FIRE MAX", bundleID: "com.dts.freefiremax", patches: patchCatalog)
          ]
          
          private struct CompactFeature: Identifiable {
              let id: String
              let title: String
              let subtitle: String
              let icon: String
              let patch: PreloadedPatch
          }
          
          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore()
              @State private var selectedGameID = "free-fire"
              @State private var remoteCatalog: [RemotePatchDescriptor]?
              @State private var logoURLs: [String: String] = [:]
              @AppStorage("patchesDarkMode") private var darkMode = false
          
              private var selectedGame: PreloadedGame {
                  preloadedGames.first(where: { $0.id == selectedGameID }) ?? preloadedGames[0]
              }
          
              private var features: [CompactFeature] {
                  let visiblePatches: [PreloadedPatch] = {
                      guard let remoteCatalog else { return selectedGame.patches }
                      return remoteCatalog.filter { $0.game == selectedGameID }.map { item in
                          PreloadedPatch(id: item.slug, title: item.title ?? item.fileName, fileName: item.fileName, replacementCount: 1)
                      }
                  }()
                  return visiblePatches.enumerated().map { index, patch in
                      CompactFeature(
                          id: patch.id,
                          title: patch.title,
                          subtitle: "Recurso pré-carregado do Free Fire.",
                          icon: index == 0 ? "scope" : (index == 1 ? "circle.grid.cross" : "antenna.radiowaves.left.and.right"),
                          patch: patch
                      )
                  }
              }

              var body: some View {
                  ZStack(alignment: .bottom) {
                      (darkMode ? Color.black : Color(.systemGroupedBackground)).ignoresSafeArea()
                      ScrollView(.vertical, showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 0) {
                              header
                              sectionTitle("SELECIONE O JOGO", top: 30)
                              gameCards
                              sectionTitle("FUNÇÕES DE AIMBOT", top: 28)
                              Text("Recursos de precisão e desempenho")
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundStyle(muted)
                                  .padding(.top, 7)
                              featureList.padding(.top, 14)
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 14)
                          .padding(.bottom, 104)
                      }
                      bottomNav
                  }
                  .preferredColorScheme(darkMode ? .dark : .light)
                  .toolbar(.hidden, for: .tabBar)
                  .navigationBarHidden(true)
                  .task {
                      async let catalog = RemotePatchAPI.fetchCatalog()
                      async let logos = RemotePatchAPI.fetchLogos()
                      remoteCatalog = await catalog
                      logoURLs = await logos
                      logoURLs["free-fire"] = String(data: Data(base64Encoded: "aHR0cHM6Ly9maWxlcy5tYW51c2Nkbi5jb20vdXNlcl91cGxvYWRfYnlfbW9kdWxlL3Nlc3Npb25fZmlsZS8zMTA1MTk2NjM5MTI5Mzg3NjIvRVpxYnZ0Z0RZc0dJa0taWC5wbmc=")!, encoding: .utf8)!
                      logoURLs["free-fire-max"] = String(data: Data(base64Encoded: "aHR0cHM6Ly9maWxlcy5tYW51c2Nkbi5jb20vdXNlcl91cGxvYWRfYnlfbW9kdWxlL3Nlc3Npb25fZmlsZS8zMTA1MTk2NjM5MTI5Mzg3NjIvV0xMdUtEZHFGbnhvbm9ybS5wbmc=")!, encoding: .utf8)!
                  }
              }
          
              private var fg: Color { darkMode ? .white : .black }
              private var muted: Color { darkMode ? Color.white.opacity(0.56) : Color.black.opacity(0.54) }
              private var panel: Color { darkMode ? Color.white.opacity(0.10) : .white }
          
              private var header: some View {
                  ZStack {
                      Text("FUNÇÕES EXTERNAL")
                          .font(.system(size: 20, weight: .bold, design: .rounded))
                          .foregroundStyle(fg)
                          .frame(maxWidth: .infinity)
                      HStack {
                          Spacer()
                          Button { darkMode.toggle() } label: {
                              Image(systemName: darkMode ? "moon.fill" : "sun.max.fill")
                                  .font(.system(size: 17, weight: .semibold))
                                  .foregroundStyle(darkMode ? .white : .black)
                                  .frame(width: 40, height: 40)
                                  .background(panel, in: Circle())
                          }
                          .accessibilityLabel(darkMode ? "Tema noite" : "Tema dia")
                      }
                  }
                  .frame(height: 42)
              }
          
              private func sectionTitle(_ title: String, top: CGFloat) -> some View {
                  Text(title)
                      .font(.system(size: 18, weight: .bold, design: .rounded))
                      .foregroundStyle(fg)
                      .padding(.top, top)
              }
          
              private var gameCards: some View {
                  GeometryReader { proxy in
                      let width = max(145, (proxy.size.width - 10) / 2)
                      HStack(spacing: 10) {
                          ForEach(preloadedGames) { game in
                              Button { withAnimation(.easeInOut(duration: 0.18)) { selectedGameID = game.id } } label: {
                                  VStack(alignment: .leading, spacing: 8) {
                                      remoteLogo(url: logoURLs[game.id])
                                          .frame(width: 42, height: 42)
                                          .clipShape(RoundedRectangle(cornerRadius: 11, style: .continuous))
                                      Text(game.title)
                                          .font(.system(size: 13, weight: .bold))
                                          .foregroundStyle(fg)
                                          .lineLimit(1)
                                      Text(selectedGameID == game.id ? "Selecionado" : "Toque para selecionar")
                                          .font(.system(size: 11, weight: .medium))
                                          .foregroundStyle(selectedGameID == game.id ? fg : muted)
                                          .lineLimit(1)
                                  }
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .padding(12)
                                  .frame(width: width, height: 116, alignment: .topLeading)
                                  .background(panel, in: RoundedRectangle(cornerRadius: 18, style: .continuous))
                                  .overlay(RoundedRectangle(cornerRadius: 18, style: .continuous).stroke(selectedGameID == game.id ? fg.opacity(0.8) : fg.opacity(0.12), lineWidth: selectedGameID == game.id ? 1.5 : 1))
                              }
                              .buttonStyle(.plain)
                          }
                      }
                  }
                  .frame(height: 116)
                  .padding(.top, 14)
              }
          
              private var featureList: some View {
                  VStack(spacing: 9) {
                      ForEach(features) { feature in
                          CompactPatchCard(feature: feature, store: store, darkMode: darkMode)
                      }
                  }
              }
          
              private var bottomNav: some View {
                  HStack(spacing: 4) {
                      navItem(title: "Início", icon: "house.fill", active: false)
                      navItem(title: "Injector", icon: "gamecontroller.fill", active: true)
                  }
                  .padding(5)
                  .frame(width: 220, height: 62)
                  .background(.ultraThinMaterial, in: Capsule())
                  .overlay(Capsule().stroke(fg.opacity(0.12), lineWidth: 1))
                  .padding(.bottom, 14)
              }
          
              private func navItem(title: String, icon: String, active: Bool) -> some View {
                  VStack(spacing: 3) {
                      Image(systemName: icon).font(.system(size: 17, weight: .semibold))
                      Text(title).font(.system(size: 11, weight: .bold))
                  }
                  .foregroundStyle(active ? .orange : fg)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(active ? fg.opacity(0.10) : .clear, in: Capsule())
              }
          
              @ViewBuilder
              private func remoteLogo(url: String?) -> some View {
                  if let url, let remoteURL = URL(string: url) {
                      AsyncImage(url: remoteURL) { phase in
                          if let image = phase.image { image.resizable().scaledToFill() } else { logoFallback }
                      }
                  } else { logoFallback }
              }
              private var logoFallback: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 11).fill(fg.opacity(0.10))
                      Image(systemName: "gamecontroller.fill").foregroundStyle(muted)
                  }
              }
          }
          
          private struct CompactPatchCard: View {
              let feature: CompactFeature
              @ObservedObject var store: PatchProjectStore
              let darkMode: Bool
              @State private var isActive = false
              @State private var activeReceipt: PatchTransactionReceipt?
              @State private var isWorking = false
              @State private var alertMessage: String?
              @State private var activationToken = UUID()
          
              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: feature.icon)
                          .font(.system(size: 20, weight: .semibold))
                          .foregroundStyle(darkMode ? .white : .black)
                          .frame(width: 30)
                      VStack(alignment: .leading, spacing: 3) {
                          Text(feature.title).font(.system(size: 15, weight: .bold)).foregroundStyle(darkMode ? .white : .black)
                          Text(feature.subtitle).font(.system(size: 11, weight: .medium)).foregroundStyle(darkMode ? Color.white.opacity(0.55) : Color.black.opacity(0.55)).lineLimit(2)
                      }
                      Spacer(minLength: 4)
                      Toggle("", isOn: Binding(get: { isActive }, set: { on in
                          guard !isWorking else { return }
                          if on { applyPatch() } else { restorePatch() }
                      }))
                      .labelsHidden()
                      .tint(darkMode ? .white : .black)
                  }
                  .padding(.horizontal, 14)
                  .frame(minHeight: 72)
                  .background(darkMode ? Color.white.opacity(0.10) : .white, in: RoundedRectangle(cornerRadius: 16, style: .continuous))
                  .overlay(RoundedRectangle(cornerRadius: 16, style: .continuous).stroke((darkMode ? Color.white : Color.black).opacity(0.10), lineWidth: 1))
                  .opacity(isWorking ? 0.6 : 1)
                  .onAppear { synchronizeAppliedState() }
                  .alert("Patch", isPresented: Binding(get: { alertMessage != nil }, set: { if !$0 { alertMessage = nil } })) {
