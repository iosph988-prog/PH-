          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore()
              @State private var selectedGameID = "free-fire"
              @State private var remoteCatalog: [RemotePatchDescriptor]?
              @State private var logoURLs: [String: String] = [:]
              @AppStorage("patchesDarkMode") private var darkMode = false

              private var selectedGame: PreloadedGame {
                  preloadedGames.first(where: { $0.id == selectedGameID }) ?? preloadedGames[0]
              }

              private var features: [CompactFeature] {
                  let visiblePatches: [PreloadedPatch] = {
                      guard let remoteCatalog else { return selectedGame.patches }
                      return remoteCatalog.filter { $0.game == selectedGameID }.map { item in
                          PreloadedPatch(id: item.slug, title: item.title ?? item.fileName, fileName: item.fileName, replacementCount: 1)
                      }
                  }()
                  return visiblePatches.enumerated().map { index, patch in
                      CompactFeature(
                          id: patch.id,
                          title: patch.title,
                          subtitle: "Recurso pré-carregado do Free Fire.",
                          icon: index == 0 ? "scope" : (index == 1 ? "circle.grid.cross" : "antenna.radiowaves.left.and.right"),
                          patch: patch
                      )
                  }
              }

              var body: some View {
