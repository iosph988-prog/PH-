name: 3105 - Nubank API Only






on:


  workflow_dispatch:
  




jobs:


  build:
  
    runs-on: macos-latest
    
    steps:
    
      - uses: actions/checkout@v4
      




      - name: Extract original target and API source
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          rm -rf source api-source build dist
          
          mkdir -p source api-source build dist
          
          tar -xzf 3105-1.1.1-original.tar.gz -C source --strip-components=1
          
          tar -xzf PHATT_kyojinx_integrado.tar.gz -C api-source
          
          test -f source/ThreeOneOSFive.xcodeproj/project.pbxproj
          
          test -s api-source/ThreeOneOSFive/SDK/APIClient.h
          
          test -s api-source/ThreeOneOSFive/SDK/libKyojinxSDK.a
          




      - name: Copy only API files into the original project
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          mkdir -p source/ThreeOneOSFive/SDK
          
          cp api-source/ThreeOneOSFive/SDK/APIClient.h source/ThreeOneOSFive/SDK/APIClient.h
          
          cp api-source/ThreeOneOSFive/SDK/libKyojinxSDK.a source/ThreeOneOSFive/SDK/libKyojinxSDK.a
          
          cp api-source/ThreeOneOSFive/helpers/LicenseManager.swift source/ThreeOneOSFive/helpers/LicenseManager.swift
          
          if ! grep -q '#import "SDK/APIClient.h"' source/ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h; then
            printf '\n#import "SDK/APIClient.h"\n' >> source/ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h
          fi
          




      - name: Register only API files in the original Xcode project
      
