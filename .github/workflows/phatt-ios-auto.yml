name: Build Proxy iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair o pacote Proxy
        run: |
          ARCHIVE='./3105-1.0.1-kyojinx-integrado.tar.gz'
          if [ ! -f "$ARCHIVE" ]; then
            echo "Arquivo não encontrado: $ARCHIVE"
            exit 1
          fi
          mkdir -p source
          tar -xzf "$ARCHIVE" -C source

      - name: Localizar e compilar o projeto Xcode
        run: |
          WORKSPACE=$(find source -name '*.xcworkspace' -type d | head -n 1)
          PROJECT=$(find source -name '*.xcodeproj' -type d | head -n 1)
          SCHEME='3105'
          if [ -n "$WORKSPACE" ]; then
            echo "Workspace encontrado: $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          elif [ -n "$PROJECT" ]; then
            echo "Projeto encontrado: $PROJECT"
            xcodebuild -list -project "$PROJECT"
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            echo "Nenhum .xcodeproj ou .xcworkspace foi encontrado dentro de source."
            find source -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

      - name: Publicar o build
        uses: actions/upload-artifact@v4
        with:
          name: proxy-build
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7

# Build não assinado para validar a compilação.
# Um IPA instalável exige certificado e provisioning profile legítimos da Apple.
