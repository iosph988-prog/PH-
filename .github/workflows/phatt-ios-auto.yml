name: Compilar PHATT iOS 

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Localizar e extrair o pacote do projeto
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 2 -type f -name '*.tar.gz' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo 'Erro: nenhum arquivo .tar.gz foi encontrado na raiz do repositório.'
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Pacote encontrado: $ARCHIVE"
          rm -rf source
          mkdir -p source
          tar -xzf "$ARCHIVE" -C source
          echo 'Conteúdo extraído:'
          find source -maxdepth 4 -type f \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print

      - name: Localizar o projeto e listar schemes
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find source -name '*.xcodeproj' -type d -print -quit)"
          WORKSPACE="$(find source -name '*.xcworkspace' -type d -print -quit)"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -list -workspace "$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            xcodebuild -list -project "$PROJECT"
          else
            echo 'Erro: nenhum projeto Xcode foi encontrado dentro do pacote.'
            exit 1
          fi

      - name: Compilar sem assinatura
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find source -name '*.xcodeproj' -type d -print -quit)"
          WORKSPACE="$(find source -name '*.xcworkspace' -type d -print -quit)"
          SCHEME='3105'
          rm -rf build

          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          fi

      - name: Publicar o aplicativo compilado
        uses: actions/upload-artifact@v4
        with:
          name: PHATT-build-unsigned
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7

# Este workflow gera um build sem assinatura apenas para validar a compilação.
# Para gerar um IPA instalável, são necessários certificado e provisioning profile da Apple.
