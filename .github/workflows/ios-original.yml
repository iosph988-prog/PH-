name: 3105 - Original Build Test



on:

  workflow_dispatch:



jobs:

  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - name: Extract original project unchanged

        shell: bash

        run: |

          set -euo pipefail

          rm -rf source build dist

          mkdir -p source build dist

          tar -xzf 3105-1.1.1-original.tar.gz -C source

          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build original archive and IPA

        shell: bash

        run: |

          set -euo pipefail

          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')

          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/3105-original.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

          APP=$(find build/3105-original.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)

          test -n "$APP"

          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/3105-original.ipa" Payload)

          cp -R build/3105-original.xcarchive dist/

          test -s dist/3105-original.ipa

      - uses: actions/upload-artifact@v4

        with:

          name: 3105-original-build

          path: dist
