name: 3105 - Original Build Test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build dist
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply app startup and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          APP_SWIFT=source/3105-1.1.1/ThreeOneOSFive/App.swift
          NAV_SWIFT=source/3105-1.1.1/ThreeOneOSFive/helpers/AppTabNavigationState.swift
          python3 - "$APP_SWIFT" "$NAV_SWIFT" <<'PY'
          from pathlib import Path
          import sys
          app, nav = map(Path, sys.argv[1:])
          a = app.read_text()
          old = "@State private var showOnboarding = OnboardingStore.shouldShow()"
          if old not in a: raise SystemExit("onboarding state declaration not found")
          app.write_text(a.replace(old, "@State private var showOnboarding = false", 1))
          n = nav.read_text()
          old = "AppSection.allCases.filter(isVisible)"
          if old not in n: raise SystemExit("visibleSections declaration not found")
          nav.write_text(n.replace(old, "return [.home, .patches].filter(isVisible)", 1))
          PY
      - name: Remove Cleaner and Wallpapers feature section
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_SWIFT=source/3105-1.1.1/ThreeOneOSFive/ContentView.swift
          python3 - "$CONTENT_SWIFT" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text()
          text2=re.sub(r'^\s*featuresSection\s*$\n?', '', text, count=1, flags=re.MULTILINE)
          if text2 == text: raise SystemExit('featuresSection call not found')
          p.write_text(text2)
          PY
      - name: Add preloaded game cards and resources
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=source/3105-1.1.1/ThreeOneOSFive
          mkdir -p "$APP_DIR/PreloadedPatches"
          cp 6F54F0A3-A7FC-4AED-8E8E-4234D141B85D.png "$APP_DIR/PreloadedPatches/free_fire_card.png"
          cp BC397CF8-956B-49A7-A6BB-772CEEA5217A.png "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
          for f in Hologramarosa\(2\).3105 Hsalto+antena\(2\).3105 Hspeito100%cache\(2\).3105 Magiccache\(2\).3105 Hsaltocache\(2\).3105 Hologramaverde\(5\).3105 Hspeitoavatar\(2\).3105 120FPS\(2\).3105 Hspescoçocache\(2\).3105 Hologramavermelho\(2\).3105 Hologramaverde\(4\).3105 Hologramazul\(2\).3105 Hspeito+antenaavatar\(1\).3105 Magicavatar\(2\).3105 Pescoço+antenaavatar\(2\).3105; do cp "$f" "$APP_DIR/PreloadedPatches/"; done
          PBX=source/3105-1.1.1/ThreeOneOSFive.xcodeproj/project.pbxproj
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          ref='''\t\tA1B2C3D5 /* PreloadedPatches */ = {isa = PBXFileReference; lastKnownFileType = folder; path = PreloadedPatches; sourceTree = "<group>"; };'''
          build='''\t\tA1B2C3D6 /* PreloadedPatches in Resources */ = {isa = PBXBuildFile; fileRef = A1B2C3D5 /* PreloadedPatches */; };'''
          if 'A1B2C3D5' not in t:
              t=t.replace('/* End PBXFileReference section */', ref+'\n/* End PBXFileReference section */')
              t=t.replace('/* End PBXBuildFile section */', build+'\n/* End PBXBuildFile section */')
              t=t.replace('3105A031 /* Assets.xcassets */,', 'A1B2C3D5 /* PreloadedPatches */,\n\t\t\t\t3105A031 /* Assets.xcassets */,')
              t=t.replace('files = (\n\t\t\t\t3105A211,', 'files = (\n\t\t\t\tA1B2C3D6 /* PreloadedPatches in Resources */,\n\t\t\t\t3105A211,')
          p.write_text(t)
          PY
          cat > source/3105-1.1.1/ThreeOneOSFive/views/PatchProjectsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          private struct PreloadedGame: Identifiable { let id: String; let title: String; let bundleID: String; let imageName: String; let patches: [PreloadedPatch] }
          private struct PreloadedPatch: Identifiable, Hashable { let id: String; let title: String; let fileName: String }
          private let preloadedGames: [PreloadedGame] = [
              PreloadedGame(id: "free-fire", title: "Free Fire", bundleID: "com.dts.freefireth", imageName: "free_fire_card", patches: [
                  PreloadedPatch(id: "normal-rosa", title: "Hologramarosa", fileName: "Hologramarosa(2).3105"), PreloadedPatch(id: "normal-salto-antena", title: "Hsalto + antena", fileName: "Hsalto+antena(2).3105"), PreloadedPatch(id: "normal-peito-cache", title: "Hspeito 100% cache", fileName: "Hspeito100%cache(2).3105"), PreloadedPatch(id: "normal-magic-cache", title: "Magic cache", fileName: "Magiccache(2).3105"), PreloadedPatch(id: "normal-salto-cache", title: "Hsalto cache", fileName: "Hsaltocache(2).3105"), PreloadedPatch(id: "normal-verde", title: "Holograma verde", fileName: "Hologramaverde(5).3105"), PreloadedPatch(id: "normal-peito-avatar", title: "Hspeito avatar", fileName: "Hspeitoavatar(2).3105"), PreloadedPatch(id: "normal-120fps", title: "120 FPS", fileName: "120FPS(2).3105"), PreloadedPatch(id: "normal-pescoco-cache", title: "Hspescoco cache", fileName: "Hspescoçocache(2).3105"), PreloadedPatch(id: "normal-vermelho", title: "Holograma vermelho", fileName: "Hologramavermelho(2).3105")
              ]),
              PreloadedGame(id: "free-fire-max", title: "Free Fire MAX", bundleID: "com.dts.freefiremax", imageName: "free_fire_max_card", patches: [
                  PreloadedPatch(id: "max-verde", title: "Holograma verde", fileName: "Hologramaverde(4).3105"), PreloadedPatch(id: "max-azul", title: "Holograma azul", fileName: "Hologramazul(2).3105"), PreloadedPatch(id: "max-peito-antena", title: "Hspeito + antena avatar", fileName: "Hspeito+antenaavatar(1).3105"), PreloadedPatch(id: "max-magic", title: "Magic avatar", fileName: "Magicavatar(2).3105"), PreloadedPatch(id: "max-pescoco", title: "Pescoço + antena avatar", fileName: "Pescoço+antenaavatar(2).3105")
              ])
          ]

          struct PatchProjectsView: View {
              @StateObject private var store = PatchProjectStore(); @State private var selectedGame: PreloadedGame?
              var body: some View { NavigationStack { ScrollView { VStack(spacing: 18) { ForEach(preloadedGames) { game in Button { selectedGame = game } label: { PreloadedGameCard(game: game) }.buttonStyle(.plain) } }.padding(.horizontal, 16).padding(.vertical, 24) }.background(Color(.systemGroupedBackground)).navigationTitle("Patches").navigationBarTitleDisplayMode(.inline).sheet(item: $selectedGame) { game in PreloadedPatchListView(game: game, store: store) } } }
          }
          private struct PreloadedGameCard: View {
              let game: PreloadedGame
              var body: some View { HStack(spacing: 16) { gameImage.frame(width: 112, height: 112).clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous)); VStack(alignment: .leading, spacing: 7) { Text(game.title).font(.title3.weight(.bold)); Text("Abrir arquivos pré-carregados").font(.title3).foregroundStyle(.secondary); Text(game.bundleID).font(.subheadline.monospaced()).foregroundStyle(.blue).lineLimit(1) }; Spacer(); Image(systemName: "chevron.right").font(.title2.weight(.semibold)).foregroundStyle(.secondary) }.padding(16).background(.background, in: RoundedRectangle(cornerRadius: 28, style: .continuous)).overlay(RoundedRectangle(cornerRadius: 28, style: .continuous).stroke(Color.gray.opacity(0.28))) }
              @ViewBuilder private var gameImage: some View { if let url = Bundle.main.url(forResource: game.imageName, withExtension: "png", subdirectory: "PreloadedPatches"), let image = UIImage(contentsOfFile: url.path) { Image(uiImage: image).resizable().scaledToFill() } else { RoundedRectangle(cornerRadius: 18).fill(Color.orange) } }
          }
          private struct PreloadedPatchListView: View {
              let game: PreloadedGame; @ObservedObject var store: PatchProjectStore; @Environment(\.dismiss) private var dismiss; @State private var activePatchIDs: Set<String> = []; @State private var pendingPatch: PreloadedPatch?; @State private var logs: [String] = []
              private var isInjected: Bool { !activePatchIDs.isEmpty }
              var body: some View { NavigationStack { List { Section { StatusPanel(isInjected: isInjected, logs: logs) }; Section { ForEach(game.patches) { patch in patchRow(patch) } } header: { Text("Patches disponíveis") } }.listStyle(.insetGrouped).navigationTitle(game.title).navigationBarTitleDisplayMode(.inline).toolbar { ToolbarItem(placement: .navigationBarTrailing) { Button("Fechar") { dismiss() } } }.alert(item: $pendingPatch) { patch in Alert(title: Text("Aplicar este patch?"), message: Text("Os arquivos serão validados e aplicados com segurança."), primaryButton: .default(Text("Aplicar patch")) { activate(patch) }, secondaryButton: .cancel()) } } }
              @ViewBuilder private func patchRow(_ patch: PreloadedPatch) -> some View { let active = activePatchIDs.contains(patch.id); HStack(spacing: 12) { Image(systemName: active ? "shippingbox.fill" : "shippingbox").font(.title2).foregroundStyle(.blue).frame(width: 30); VStack(alignment: .leading, spacing: 4) { Text(patch.title).font(.body.weight(.semibold)); Label(active ? "Patch ativado" : "Patch desativado", systemImage: active ? "checkmark.circle.fill" : "power").font(.caption).foregroundStyle(active ? .green : .secondary) }; Spacer(); Toggle("", isOn: Binding(get: { activePatchIDs.contains(patch.id) }, set: { enabled in if enabled { pendingPatch = patch } else { deactivate(patch) } })).labelsHidden().tint(.blue) }.padding(.vertical, 8) }
              private func activate(_ patch: PreloadedPatch) { if let url = bundledFile(named: patch.fileName) { store.importPackage(at: url) }; activePatchIDs.insert(patch.id); logs.insert("[\(timeStamp())] Mod injetado \(patch.title)", at: 0) }
              private func deactivate(_ patch: PreloadedPatch) { activePatchIDs.remove(patch.id); logs.insert("[\(timeStamp())] Mod desativado \(patch.title)", at: 0) }
              private func timeStamp() -> String { let f = DateFormatter(); f.dateFormat = "HH:mm:ss"; return f.string(from: Date()) }
              private func bundledFile(named name: String) -> URL? { let normalized = name.precomposedStringWithCanonicalMapping; return (Bundle.main.urls(forResourcesWithExtension: "3105", subdirectory: "PreloadedPatches") ?? []).first { $0.lastPathComponent.precomposedStringWithCanonicalMapping == normalized } }
          }
          private struct StatusPanel: View {
              let isInjected: Bool; let logs: [String]
              var body: some View { VStack(alignment: .leading, spacing: 12) { HStack(spacing: 8) { Circle().fill(isInjected ? .green : .blue).frame(width: 10, height: 10); Text("STATUS").font(.headline) }; Text(isInjected ? "Mod injetado" : "Original restaurado").font(.subheadline.weight(.semibold)).foregroundStyle(isInjected ? .green : .blue); Text("DIAGNÓSTICO EM TEMPO REAL").font(.caption.weight(.bold)).foregroundStyle(.secondary); if logs.isEmpty { Text("[--:--:--] Sistema pronto").font(.caption.monospaced()).foregroundStyle(.secondary); Text("[--:--:--] Nenhum mod ativo").font(.caption.monospaced()).foregroundStyle(.secondary) } else { ForEach(logs, id: \.self) { Text($0).font(.caption.monospaced()).foregroundStyle(.green) } } }.frame(maxWidth: .infinity, alignment: .leading).padding(.vertical, 6) }
          }
          SWIFT

          test -s "$APP_DIR/PreloadedPatches/free_fire_card.png"
          test -s "$APP_DIR/PreloadedPatches/free_fire_max_card.png"
      - name: Build original archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nubank-preloaded-cards.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=$(find build/nubank-preloaded-cards.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/nubank-preloaded-cards.ipa" Payload)
          cp -R build/nubank-preloaded-cards.xcarchive dist/
          test -s dist/nubank-preloaded-cards.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: nubank-preloaded-cards-home-patches
          path: dist/nubank-preloaded-cards.ipa
