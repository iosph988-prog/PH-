name: Build 3105 iOS
















































on:
















  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    
































jobs:
















  build:
  
    runs-on: macos-latest
    
    steps:
    
      - name: Baixar arquivos do repositório
      
        uses: actions/checkout@v4
        
































      - name: Reconstruir e extrair o pacote limpo
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          mkdir -p source
          
          cat ./nvbypass1.0_appicon_fixed_small-00 ./nvbypass1.0_appicon_fixed_small-01 ./nvbypass1.0_appicon_fixed_small-02 > /tmp/nvbypass1.0_appicon_fixed.tar.gz
          
          gzip -t /tmp/nvbypass1.0_appicon_fixed.tar.gz
          
          tar -xzf /tmp/nvbypass1.0_appicon_fixed.tar.gz -C source
          
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          
          test -n "$PROJECT"
          
































      - name: Compilar projeto Xcode
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          
          test -n "$PROJECT"
          
          xcodebuild -list -project "$PROJECT"
          
          xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/3105.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
































      - name: Criar IPA não assinada
      
