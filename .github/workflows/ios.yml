name: Build 3105 interface reduzida


on:
  workflow_dispatch:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4


      - name: Reconstruir base funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat ./3105_111_phxiter_safe_small-00 ./3105_111_phxiter_safe_small-01 ./3105_111_phxiter_safe_small-02 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C source


      - name: Aplicar somente a navegacao solicitada
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(find source -type d -path '*/ThreeOneOSFive' | head -n 1)
          test -n "$ROOT"
          if ! grep -q 'DisplayIdentityAttestationToken' "$ROOT/helpers/KernelExploit.swift"; then
            printf '%s\n' 'func DisplayIdentityAttestationToken() -> String { return "" }' 'func DisplayIdentityAttributionURL() -> Foundation.URL? { return nil }' >> "$ROOT/helpers/KernelExploit.swift"
          fi
          sed -i '' -E 's/\[ *\.home *, *\.patches *, *\.files *\]/[.home, .patches]/g' "$ROOT/helpers/AppTabNavigationState.swift"
          sed -i '' 's/"tab.home"/"Início"/g; s/"tab.patches"/"Injetor"/g' "$ROOT/ContentView.swift"
          sed -i '' -E 's/Text\(language\.text\("onboarding\.step".*$/EmptyView()/g' "$ROOT/ContentView.swift"


          sed -i '' 's/AppInfo\.releaseVersion/"1.1.1"/g' "$ROOT/ContentView.swift"
          sed -i '' 's/ExploitSupportPolicy\.verifiedIOS17Range/"iOS 17"/g' "$ROOT/views/SettingsView.swift"
          if ! grep -q 'NVBYPASS_SAFE_COMPAT' "$ROOT/helpers/KernelExploit.swift"; then
            cat >> "$ROOT/helpers/KernelExploit.swift" <<'SWIFT'

// NVBYPASS_SAFE_COMPAT: inert compatibility symbols for safe UI build.
private func sandbox_access_is_active() -> Int32 { return 0 }
private func kexploit_opa334() -> Int32 { return -1 }
private func proc_self() -> UnsafeMutableRawPointer? { return nil }
private func sandbox_escape(_ proc: UnsafeMutableRawPointer?) -> Int32 { return -1 }
private enum ContainerStore {
  static func resolveAppContainerPath(bundleID: String) -> String? { return nil }
  static func isApplicationContainerPath(_ path: String) -> Bool { return false }
}
SWIFT
          fi

      - name: Compilar projeto Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -name '*.xcodeproj' -type d | head -n 1)
          EXCLUDED='AppDataBrowserView.swift ContainerStore.swift ContainerIdentityResolver.swift ContainerBrowserLogic.swift CleanerView.swift WallpaperLabView.swift OnboardingView.swift DisplayIdentityAttribution.swift'
          xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build EXCLUDED_SOURCE_FILE_NAMES="$EXCLUDED" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO


      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: 3105-interface-inicio-injetor
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7

