name: Build nvbypass1.0 versão 18

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Reconstruir versão 18 funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat ./nvbypass1.0_versao1827_safe_small-00 ./nvbypass1.0_versao1827_safe_small-01 ./nvbypass1.0_versao1827_safe_small-02 > /tmp/nvbypass1_versao18.tar.gz
          gzip -t /tmp/nvbypass1_versao18.tar.gz
          tar -xzf /tmp/nvbypass1_versao18.tar.gz -C source
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"

      - name: Compilar sem alterar a lógica da versão 18
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          xcodebuild -list -project "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nvbypass1.0-versao18.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Criar IPA não assinada
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/nvbypass1.0-versao18.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry nvbypass1.0-versao18.ipa Payload

      - name: Publicar build da versão 18
        uses: actions/upload-artifact@v4
        with:
          name: nvbypass1.0-versao18-api-interface-build
          path: |
            build/nvbypass1.0-versao18.ipa
            build/nvbypass1.0-versao18.xcarchive
          if-no-files-found: error
          retention-days: 7
