name: Build 3105 interface reduzida
































on:
  workflow_dispatch:
  push:
    branches: [ main ]
































jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
































      - name: Reconstruir base funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat ./3105_111_phxiter_safe_small-00 ./3105_111_phxiter_safe_small-01 ./3105_111_phxiter_safe_small-02 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C source
































      - name: Aplicar somente a navegacao solicitada
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(find source -type d -path '*/ThreeOneOSFive' | head -n 1)
          test -n "$PWD/source/3105_111_migrated/ThreeOneOSFive"
          echo  | base64 --decode > /tmp/nvbypass_compat.py
          echo "" | base64 --decode > /tmp/nvbypass_mcm_patch.py
          python3 /tmp/nvbypass_mcm_patch.py "$PWD/source/3105_111_migrated/ThreeOneOSFive"
          python3 /tmp/nvbypass_compat.py "$PWD/source/3105_111_migrated/ThreeOneOSFive"
          echo 'aW1wb3J0IHJlLHN5cwpmcm9tIHBhdGhsaWIgaW1wb3J0IFBhdGgKcD1QYXRoKHN5cy5hcmd2WzFdKQp0PXAucmVhZF90ZXh0KCkKdD1yZS5zdWIocidcW1teXF1cbl0qXC5ob21lW15cXVxuXSpcLnBhdGNoZXNbXlxdXG5dKlxdJywgJ1suaG9tZSwgLnBhdGNoZXNdJywgdCwgY291bnQ9MSkKcC53cml0ZV90ZXh0KHQpCg==' | base64 --decode | python3 - "$ROOT/helpers/AppTabNavigationState.swift"
          sed -i '' 's/"tab.home"/"Início"/g; s/"tab.patches"/"Injetor"/g' "$ROOT/ContentView.swift"
          sed -i '' 's/AppInfo.releaseVersion/"1.1.1"/g' "$ROOT/ContentView.swift"
          sed -i '' 's/ExploitSupportPolicy.verifiedIOS17Range/"iOS 17"/g' "$ROOT/views/SettingsView.swift" "$ROOT/views/OnboardingView.swift"
          sed -i '' -E 's/String(proc, radix: 16)/String(UInt(bitPattern: proc), radix: 16)/g; s/if proc == 0/if proc == nil/g' "$ROOT/helpers/KernelExploit.swift"
          echo "" | base64 --decode >> "$ROOT/views/SettingsView.swift"
































      - name: Compilar projeto Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -name '*.xcodeproj' -type d | head -n 1)
          echo "" | base64 --decode > /tmp/nvbypass_final_patch.py
          python3 /tmp/nvbypass_final_patch.py "$PWD/source/3105_111_migrated/ThreeOneOSFive"
           xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO EXCLUDED_SOURCE_FILE_NAMES="KernelExploit.swift FileBrowserView.swift CleanerView.swift OnboardingView.swift"
































      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: 3105-interface-inicio-injetor
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7

































