name: Build 3105 iOS








on:
  workflow_dispatch:
  push:
    branches: [ main ]








jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
      - name: Extrair código e projetos pré-carregados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          tar -xzf ./PHATT_injector_freefiremax_v5.tar.gz -C source
          tar -xzf ./PHATT_preloaded_assets_a.tar.gz -C source
          tar -xzf ./PHATT_preloaded_assets_b.tar.gz -C source
          test -d "$(find source -type d -name '*.xcodeproj' -print -quit)"
      - name: Compilar projeto Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          xcodebuild -list -project "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/3105.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Criar IPA não assinada
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/3105.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && /usr/bin/zip -qry 3105-unsigned.ipa Payload)
          test -s build/3105-unsigned.ipa
      - name: Publicar IPA e archive
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build
          path: |
            build/3105-unsigned.ipa
            build/3105.xcarchive
          if-no-files-found: error
          retention-days: 7
