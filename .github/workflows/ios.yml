name: Build 3105 interface reduzidaon:  workflow_dispatch:  push:    branches: [ main ]jobs:  build:    runs-on: macos-latest    steps:      - name: Baixar repositorio        uses: actions/checkout@v4      - name: Reconstruir base funcional        shell: bash        run: |          set -euo pipefail          mkdir -p source          cat ./3105_111_phxiter_safe_small-00 ./3105_111_phxiter_safe_small-01 ./3105_111_phxiter_safe_small-02 > /tmp/base.tar.gz          gzip -t /tmp/base.tar.gz          tar -xzf /tmp/base.tar.gz -C source      - name: Aplicar somente a navegacao solicitada        shell: bash        run: |          set -euo pipefail          ROOT=$(find source -type d -path '*/ThreeOneOSFive' | head -n 1)          test -n "$ROOT"          if ! grep -q 'DisplayIdentityAttestationToken' "$ROOT/helpers/KernelExploit.swift"; then            printf '%s\n' 'func DisplayIdentityAttestationToken() -> String { return "" }' 'func DisplayIdentityAttributionURL() -> Foundation.URL? { return nil }' >> "$ROOT/helpers/KernelExploit.swift"          fi          sed -i '' -E 's/\[ *\.home *, *\.patches *, *\.files *\]/[.home, .patches]/g' "$ROOT/helpers/AppTabNavigationState.swift"          sed -i '' 's/"tab.home"/"Início"/g; s/"tab.patches"/"Injetor"/g' "$ROOT/ContentView.swift"          sed -i '' -E 's/Text\(language\.text\("onboarding\.step".*$/EmptyView()/g' "$ROOT/ContentView.swift"      - name: Compilar projeto Xcode        shell: bash        run: |          set -euo pipefail          PROJECT=$(find source -name '*.xcodeproj' -type d | head -n 1)          EXCLUDED='AppDataBrowserView.swift ContainerStore.swift ContainerIdentityResolver.swift ContainerBrowserLogic.swift FileBrowserView.swift CleanerView.swift WallpaperLabView.swift OnboardingView.swift DisplayIdentityAttribution.swift'          xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build EXCLUDED_SOURCE_FILE_NAMES="$EXCLUDED" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO      - name: Publicar build        uses: actions/upload-artifact@v4        with:          name: 3105-interface-inicio-injetor          path: build/Build/Products/Release-iphoneos/          if-no-files-found: error          retention-days: 7
