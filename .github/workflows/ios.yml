name: Build PH XITER layout corrigido v2








on:
  workflow_dispatch:
  push:
    branches: [ main ]








jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar pacote do layout corrigido
        uses: actions/checkout@v4








      - name: Reconstruir e extrair pacote v2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source /tmp/PH_XITER_interface_layout_v2.tar.gz
          mkdir -p source
          pwd
          set +e
          rm -f /tmp/PH_XITER_interface_layout_v2.tar.gz
          cat ./PH_XITER_interface_layout_v2.part-aa ./PH_XITER_interface_layout_v2.part-ab ./PH_XITER_interface_layout_v2.part-ac > /tmp/PH_XITER_interface_layout_v2.tar.gz
          CAT_STATUS=$?
          echo "cat_status=$CAT_STATUS"
          ls -lh /tmp/PH_XITER_interface_layout_v2.tar.gz
          file /tmp/PH_XITER_interface_layout_v2.tar.gz
          gzip -t /tmp/PH_XITER_interface_layout_v2.tar.gz
          GZIP_STATUS=$?
          echo "gzip_status=$GZIP_STATUS"
          tar -tzf /tmp/PH_XITER_interface_layout_v2.tar.gz >/dev/null
          TAR_STATUS=$?
          echo "tar_status=$TAR_STATUS"
          test "$CAT_STATUS" -eq 0 && test "$GZIP_STATUS" -eq 0 && test "$TAR_STATUS" -eq 0
          tar -tzf /tmp/PH_XITER_interface_layout_v2.tar.gz >/dev/null
          tar -tzf /tmp/PH_XITER_interface_layout_v2.tar.gz >/dev/null
          tar -xzf /tmp/PH_XITER_interface_layout_v2.tar.gz -C source
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $PROJECT"








      - name: Criar archive Xcode do layout corrigido
        shell: bash
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          echo "Scheme selecionado: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/ph_xiter_layout_corrigido_v2.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO








      - name: Criar IPA do layout corrigido
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/ph_xiter_layout_corrigido_v2.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R "$APP" build/Payload/
          (cd build && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/ph_xiter_layout_corrigido_v2.ipa" Payload)
          cp -R build/ph_xiter_layout_corrigido_v2.xcarchive dist/
          test -s dist/ph_xiter_layout_corrigido_v2.ipa
          test -d dist/ph_xiter_layout_corrigido_v2.xcarchive
          ls -lah dist








      - name: Publicar IPA e XCARCHIVE do layout corrigido
        uses: actions/upload-artifact@v4
        with:
          name: ph-xiter-layout-corrigido-v2-build
