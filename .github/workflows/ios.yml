name: Build PH XITER layout corrigido v2
















on:
  workflow_dispatch:
  push:
    branches: [ main ]
















jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar pacote do layout corrigido
        uses: actions/checkout@v4
















      - name: Reconstruir e extrair pacote v2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source /tmp/PH_XITER_interface_layout_v2.tar.gz /tmp/PH_XITER_base
          mkdir -p source /tmp/PH_XITER_base
          cat PH_XITER_interface_layout_v2.part-aa \
              PH_XITER_interface_layout_v2.part-ab \
              PH_XITER_interface_layout_v2.part-ac \
              > /tmp/PH_XITER_interface_layout_v2.tar.gz
          gzip -t /tmp/PH_XITER_interface_layout_v2.tar.gz
          tar -tzf /tmp/PH_XITER_interface_layout_v2.tar.gz >/dev/null
          tar -xzf /tmp/PH_XITER_interface_layout_v2.tar.gz -C source
          test -f source/ThreeOneOSFive/views/PatchProjectsView.swift
          tar -xzf PHATT_PH_XITER.tar.gz -C /tmp/PH_XITER_base
          BASE_ROOT=$(find /tmp/PH_XITER_base -maxdepth 2 -type d -name '*.xcodeproj' -print -quit | sed 's#/.xcodeproj##')
          test -n "$BASE_ROOT"
          cp -R "$BASE_ROOT" source/
          BASE_SOURCE_DIR=$(dirname "$BASE_ROOT")/ThreeOneOSFive
          test -d "$BASE_SOURCE_DIR"
          rm -rf "$BASE_SOURCE_DIR"
          cp -R source/ThreeOneOSFive "$BASE_SOURCE_DIR"
          rm -rf source/ThreeOneOSFive
          mv "$BASE_SOURCE_DIR" source/ThreeOneOSFive
          PROJECT=$(find source -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          test -f "$PROJECT/project.pbxproj"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $PROJECT"

      - name: Criar archive Xcode do layout corrigido
        shell: bash
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          echo "Scheme selecionado: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/ph_xiter_layout_corrigido_v2.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO


