name: Build nvbypass1.0 correto

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Reconstruir pacote nvbypass1.0 safe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat nvbypass1.0_versao1827_safe_small-00 nvbypass1.0_versao1827_safe_small-01 nvbypass1.0_versao1827_safe_small-02 > /tmp/nvbypass1.0.tar.gz
          tar -xzf /tmp/nvbypass1.0.tar.gz -C source
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Criar archive Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "Usando scheme: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/nvbypass1.0.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Criar IPA nvbypass1.0
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/nvbypass1.0.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R "$APP" build/Payload/
          (cd build && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/nvbypass1.0.ipa" Payload)
          cp -R build/nvbypass1.0.xcarchive dist/
          test -s dist/nvbypass1.0.ipa
          test -d dist/nvbypass1.0.xcarchive
          ls -lah dist

      - name: Publicar IPA e XCARCHIVE
        uses: actions/upload-artifact@v4
        with:
          name: nvbypass1.0-safe-build
          path: dist
          if-no-files-found: error
          retention-days: 7
