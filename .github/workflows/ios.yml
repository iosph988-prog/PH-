name: Diagnosticar interface 3105

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Reconstruir base funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat ./3105_111_phxiter_migrado_small-00 ./3105_111_phxiter_migrado_small-01 ./3105_111_phxiter_migrado_small-02 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C source
          echo '=== Swift files ==='
          find source -type f -name '*.swift' -print | sort
          echo '=== UI labels and video references ==='
          grep -RniE --include='*.swift' 'Home|Files|Patches|Cleaner|Wallpapers|Step|step|Video|video|1234' source || true
          echo '=== Xcode projects ==='
          find source -type d \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print
