name: Build 3105 iOS
















































on:
















  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    
































jobs:
















  build:
  
    runs-on: macos-latest
    
    steps:
    
      - name: Baixar arquivos do repositório
      
        uses: actions/checkout@v4
        
































      - name: Extrair código e projetos pré-carregados
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          ARCHIVE='./PHATT_freefire_card_v2.tar.gz'
          
          ASSETS_A='./PHATT_preloaded_assets_a.tar.gz'
          
          ASSETS_B='./PHATT_preloaded_assets_b.tar.gz'
          
          for file in "$ARCHIVE" "$ASSETS_A" "$ASSETS_B"; do
          
            if [ ! -f "$file" ]; then
            
              echo "ERRO: pacote não encontrado: $file"
              
              exit 1
              
            fi
            
          done
          
          mkdir -p source
          
          tar -xzf "$ARCHIVE" -C source
          
          tar -xzf "$ASSETS_A" -C source
          
          tar -xzf "$ASSETS_B" -C source
          
          find source -maxdepth 6 -print | sort | head -400
          
































      - name: Verificar e compilar projeto Xcode
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          WORKSPACE=$(find source -type d -name '*.xcworkspace' -print -quit)
          
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          
          mkdir -p build
          
          if [ -n "$WORKSPACE" ]; then
          
            echo "Workspace: $WORKSPACE"
      - name: Criar IPA não assinada
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -qry 3105-unsigned.ipa Payload
      - name: Publicar IPA e archive
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build
          path: |
            build/3105-unsigned.ipa
            build/3105.xcarchive
          if-no-files-found: error
          retention-days: 7
