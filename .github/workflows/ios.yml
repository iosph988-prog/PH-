name: Build 3105 interface reduzida


on:
  workflow_dispatch:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Reconstruir base funcional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat ./3105_111_phxiter_safe_small-00 ./3105_111_phxiter_safe_small-01 ./3105_111_phxiter_safe_small-02 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C source
      - name: Aplicar somente a navegação solicitada
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(find source -type d -path '*/ThreeOneOSFive' | head -n 1)
          test -n "$ROOT"
          export ROOT
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          state = root / 'helpers' / 'AppTabNavigationState.swift'
          text = state.read_text()
          text2 = re.sub(r'\[\s*\.home\s*,\s*\.patches\s*,\s*\.files\s*\]', '[.home, .patches]', text)
          if text2 != text:
              state.write_text(text2)
          content = root / 'ContentView.swift'
          text = content.read_text()
          text = text.replace('case .home: return "tab.home"', 'case .home: return "tab.home"')
          text = text.replace('case .patches: return "tab.patches"', 'case .patches: return "tab.patches"')
          # Remove the visible step counter text without changing onboarding logic.
          text = re.sub(r'Text\(language\.text\("onboarding\.step"[^\n]*\)\)', 'EmptyView()', text)
          content.write_text(text)
          # Translate only the two remaining navigation labels when they are declared in localization dictionaries.
          for p in root.rglob('*.swift'):
              s = p.read_text()
              n = re.sub(r'("tab\.home"\s*:\s*)"[^"]*"', r'\1"Início"', s)
              n = re.sub(r'("tab\.patches"\s*:\s*)"[^"]*"', r'\1"Injetor"', n)
              if n != s:
                  p.write_text(n)
          PY
          echo 'Tabs configuradas:'
          grep -RniE --include='*.swift' '\.home.*\.patches|tab\.home|tab\.patches|onboarding\.step' "$ROOT" || true
      - name: Localizar projeto Xcode
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find source -name '*.xcworkspace' -type d | head -n 1)
          PROJECT=$(find source -name '*.xcodeproj' -type d | head -n 1)
          if [ -n "$WORKSPACE" ]; then echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"; echo 'kind=workspace' >> "$GITHUB_OUTPUT"; else echo "project=$PROJECT" >> "$GITHUB_OUTPUT"; echo 'kind=project' >> "$GITHUB_OUTPUT"; fi
      - name: Compilar projeto Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.locate.outputs.kind }}" = workspace ]; then
            xcodebuild -workspace "${{ steps.locate.outputs.workspace }}" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project "${{ steps.locate.outputs.project }}" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi
      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: 3105-interface-inicio-injetor
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
          retention-days: 7

