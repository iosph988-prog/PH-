name: Build 3105 iOS



on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    


jobs:

  build:
  
    runs-on: macos-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Extract package
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          test -f PHATT_PH_XITER.tar.gz
          
          rm -rf source build
          
          mkdir -p source build
          
          tar -xzf PHATT_PH_XITER.tar.gz -C source
          
      - name: Locate Xcode project
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          
          WORKSPACE=$(find source -type d -name '*.xcworkspace' -print -quit)
          
          test -n "$PROJECT" -o -n "$WORKSPACE"
          
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          
          echo "Project: $PROJECT"
          
          echo "Workspace: $WORKSPACE"
          
      - name: List schemes
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          if [ -n "${WORKSPACE:-}" ]; then xcodebuild -list -workspace "$WORKSPACE"; else xcodebuild -list -project "$PROJECT"; fi
          
      - name: Build unsigned archive
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          if [ -n "${WORKSPACE:-}" ]; then xcodebuild -workspace "$WORKSPACE" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/3105.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO; else xcodebuild -project "$PROJECT" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/3105.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO; fi
          
      - name: Create IPA
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          mkdir -p build/Payload
          
          cp -R build/3105.xcarchive/Products/Applications/*.app build/Payload/
          
          cd build
          
          zip -qry 3105-unsigned.ipa Payload
          
      - name: Upload IPA
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: 3105-build
          
          path: build/3105-unsigned.ipa
          
          retention-days: 7
          



















































