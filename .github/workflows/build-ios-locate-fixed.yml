name: Build 3105 iOS






on:


  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    




jobs:


  build:
  
    runs-on: macos-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Extract package
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          test -f 3105-1.1.1-original.tar.gz
          
          rm -rf source build
          
          mkdir -p source build
          
          tar -xzf 3105-1.1.1-original.tar.gz -C source
          
      - name: Locate Xcode project
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          PROJECT=$(find source -type d -name '*.xcodeproj' -print -quit)
          
          WORKSPACE=$(find source -type d -name '*.xcworkspace' -print -quit)
          
          test -n "$PROJECT" -o -n "$WORKSPACE"
          
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          
          echo "Project: $PROJECT"
          
          echo "Workspace: $WORKSPACE"
          
      - name: List schemes
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          if [ -n "${WORKSPACE:-}" ]; then xcodebuild -list -workspace "$WORKSPACE"; else xcodebuild -list -project "$PROJECT"; fi
          
      - name: Build unsigned archive
      
        shell: bash
        
        run: |
        
